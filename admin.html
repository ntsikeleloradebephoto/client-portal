<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>POS & Cashup Terminal</title>
    <style>
        :root {
            --cyan-bright: #00f0ff;
            --gold-light: #ffd700;
            --green-active: #00ff66;
            --red-alert: #ff3333;
            --text-muted: #888888;
            --bg-dark: #121212;
            --card-bg: #1e1e1e;
            --border-color: #333333;
        }
        body {
            background-color: var(--bg-dark);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .tab-content {
            display: block;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 24px;
            max-width: 1000px;
            margin: 0 auto;
        }
        .section-title {
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--cyan-bright);
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #cccccc;
            margin-bottom: 6px;
            text-transform: uppercase;
        }
        .form-control {
            width: 100%;
            padding: 10px 12px;
            background: #2a2a2a;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: #ffffff;
            font-size: 14px;
            box-sizing: border-box;
        }
        .form-control:focus {
            border-color: var(--cyan-bright);
            outline: none;
        }
        .btn-submit {
            background: var(--cyan-bright);
            color: #000000;
            font-weight: 700;
            padding: 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }
        .btn-submit:hover {
            opacity: 0.9;
        }
        .summary-grid {
            display: grid;
            gap: 10px;
        }
        .summary-card {
            background: #252525;
            border: 1px solid var(--border-color);
            border-radius: 6px;
        }
        .summary-label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 4px;
        }
        .summary-val {
            font-weight: 700;
        }
        .pos-table-container {
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background: #181818;
        }
        .ledger-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        .ledger-table th, .ledger-table td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }
        .ledger-table th {
            background: #222222;
            color: var(--gold-light);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
    </style>
</head>
<body>

    <!-- TAB: CASHUP -->
    <div id="tabCashup" class="tab-content">
        <div class="section-title">
            <span>Daily Cashup Reconciliation Terminal</span>
            <span id="cashupUserBadge" style="color: var(--cyan-bright); font-size: 11px; font-weight: 500;">USER: UNASSIGNED</span>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
            <div>
                <form id="cashupForm" onsubmit="submitCashup(event)">
                    <div class="form-group">
                        <label>Float / Opening Cash (ZAR)</label>
                        <input type="number" id="cashupFloat" class="form-control" value="0.00" step="0.01" required oninput="calculateCashupVariance()">
                    </div>
                    <div class="form-group">
                        <label>Total Cash Sales Counted / Declared (ZAR)</label>
                        <input type="number" id="cashupActualCash" class="form-control" placeholder="0.00" step="0.01" required oninput="calculateCashupVariance()">
                    </div>
                    <div class="form-group">
                        <label>Total Card / POS Sales Declared (ZAR)</label>
                        <input type="number" id="cashupActualCard" class="form-control" placeholder="0.00" step="0.01" required oninput="calculateCashupVariance()">
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                        <div class="form-group">
                            <label>Cash Discrepancy / Variance</label>
                            <input type="text" id="cashupVariance" class="form-control" readonly value="R 0.00" style="font-weight: 600;">
                        </div>
                        <div class="form-group">
                            <label>Card Discrepancy / Variance</label>
                            <input type="text" id="cashupCardVariance" class="form-control" readonly value="R 0.00" style="font-weight: 600;">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Notes / Explanations for Discrepancies</label>
                        <textarea id="cashupNotes" class="form-control" placeholder="Optional comments..." rows="3"></textarea>
                    </div>
                    <button type="submit" class="btn-submit" style="width: 100%;">SUBMIT CASHUP REPORT</button>
                </form>
            </div>

            <div>
                <div style="font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--gold-light); margin-bottom: 8px;">System Expected Totals (Today)</div>
                <div class="summary-grid" style="grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px;">
                    <div class="summary-card" style="padding: 12px 16px;">
                        <div class="summary-label">Expected Cash Sales</div>
                        <div class="summary-val" id="expectedCashSales" data-val="0.00" style="font-size: 20px; color: var(--cyan-bright);">R 0.00</div>
                    </div>
                    <div class="summary-card" style="padding: 12px 16px;">
                        <div class="summary-label">Expected Card Sales</div>
                        <div class="summary-val" id="expectedCardSales" data-val="0.00" style="font-size: 20px; color: var(--gold-light);">R 0.00</div>
                    </div>
                </div>

                <div class="section-title" style="margin-top: 14px;">Manager Tracking / Cashup History</div>
                <div class="pos-table-container" style="max-height: 240px; overflow-y: auto;">
                    <table class="ledger-table">
                        <thead>
                            <tr>
                                <th>Date/Time</th>
                                <th>Cashier</th>
                                <th>Declared Cash</th>
                                <th>Cash Var</th>
                                <th>Card Var</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="cashupHistoryTable">
                            <tr><td colspan="6" style="text-align: center; color: var(--text-muted); padding: 20px;">No cashups recorded.</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentUser = { full_name: 'Store Cashier' };
        let supabaseClient = null; // Replace or initialize with your valid Supabase client instance if available

        function showNotification(message, type) {
            alert(`[${type.toUpperCase()}] ${message}`);
        }

        function logAuditAction(actionDescription) {
            console.log(`Audit Log: ${actionDescription}`);
        }

        function fetchAdminOrders() {
            // Placeholder for data refreshing logic
            console.log("Refreshing admin data...");
        }

        function calculateCashupVariance() {
            const floatVal = parseFloat(document.getElementById('cashupFloat').value) || 0;
            const actualCash = parseFloat(document.getElementById('cashupActualCash').value) || 0;
            const actualCard = parseFloat(document.getElementById('cashupActualCard').value) || 0;

            const expectedCashSalesEl = document.getElementById('expectedCashSales');
            const expectedCardSalesEl = document.getElementById('expectedCardSales');

            const expectedCashSales = parseFloat(expectedCashSalesEl.dataset.val) || 0;
            const expectedCardSales = parseFloat(expectedCardSalesEl.dataset.val) || 0;

            // Discrepancy is calculated based solely on Total Declared Cash/Card including the Float[cite: 2]
            const cashVar = actualCash - (expectedCashSales + floatVal);
            const cardVar = actualCard - expectedCardSales;

            const cashVarEl = document.getElementById('cashupVariance');
            cashVarEl.value = `R ${cashVar.toFixed(2)}`;
            cashVarEl.style.color = cashVar < 0 ? 'var(--red-alert)' : (cashVar > 0 ? 'var(--cyan-bright)' : 'var(--green-active)');

            const cardVarEl = document.getElementById('cashupCardVariance');
            cardVarEl.value = `R ${cardVar.toFixed(2)}`;
            cardVarEl.style.color = cardVar < 0 ? 'var(--red-alert)' : (cardVar > 0 ? 'var(--cyan-bright)' : 'var(--green-active)');
        }

        async function submitCashup(event) {
            event.preventDefault();

            const floatVal = parseFloat(document.getElementById('cashupFloat').value) || 0;
            const actualCash = parseFloat(document.getElementById('cashupActualCash').value) || 0;
            const actualCard = parseFloat(document.getElementById('cashupActualCard').value) || 0;

            const expectedCashSales = parseFloat(document.getElementById('expectedCashSales').dataset.val) || 0;
            const expectedCardSales = parseFloat(document.getElementById('expectedCardSales').dataset.val) || 0;

            const expectedTotalCash = floatVal + expectedCashSales;
            
            // Discrepancy is calculated based solely on Total Declared Cash/Card including the Float[cite: 2]
            const cashVar = actualCash - expectedTotalCash;
            const cardVar = actualCard - expectedCardSales;
            
            const notes = document.getElementById('cashupNotes').value.trim();
            const cashierName = currentUser ? currentUser.full_name : 'Cashier Floor';

            const payload = {
                cashier_name: cashierName,
                opening_float: floatVal,
                declared_cash: actualCash,
                declared_card: actualCard,
                expected_cash: expectedTotalCash,
                expected_card: expectedCardSales,
                cash_variance: cashVar,
                card_variance: cardVar,
                notes: notes,
                created_at: new Date().toISOString()
            };

            if (supabaseClient) {
                const { error } = await supabaseClient.from('cashups').insert([payload]);
                if (error) {
                    showNotification(`Cashup submission failed: ${error.message}`, 'error');
                    return;
                }
            }

            showNotification('Cashup report submitted successfully!', 'success');
            logAuditAction(`Submitted Cashup Report (Cash Var: R ${cashVar.toFixed(2)}, Card Var: R ${cardVar.toFixed(2)})`);
            
            document.getElementById('cashupForm').reset();
            document.getElementById('cashupFloat').value = '0.00';
            fetchAdminOrders();
        }
    </script>
</body>
</html>
