<!-- TAB 2: ENHANCED CONSIGNMENT & INVENTORY INTAKE -->
<div id="tab2" class="tab-content">
    <div class="section-title">
        <span>Consignment Stock Intake & Batch Staging</span>
        <span style="font-size: 11px; color: var(--gold-light);">Batch Ref: <strong id="intakeBatchRefDisplay">AUTO-GEN</strong></span>
    </div>
    
    <form id="stockForm" onsubmit="addStockItemToBatch(event)" style="margin-bottom: 24px;">
        <div class="intake-form-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px;">
            <div class="form-group" style="margin:0;">
                <label>Barcode / SKU (Auto-generated if blank)</label>
                <input type="text" id="stockSku" class="form-control" placeholder="e.g. 600123456789">
            </div>
            <div class="form-group" style="margin:0;">
                <label>SKU Description / Product Name</label>
                <input type="text" id="stockName" class="form-control" required placeholder="e.g. Ceramic Teaset">
            </div>
            <div class="form-group" style="margin:0;">
                <label>Category</label>
                <select id="stockCategory" class="form-control" required>
                    <option value="Ceramics">Ceramics</option>
                    <option value="Homeware">Homeware</option>
                    <option value="Textiles">Textiles</option>
                    <option value="Decor">Decor</option>
                    <option value="General" selected>General</option>
                </select>
            </div>
            <div class="form-group" style="margin:0;">
                <label>Consignor / Supplier Partner</label>
                <input type="text" id="stockSupplier" class="form-control" required placeholder="e.g. Craft Master Wholesalers">
            </div>
            <div class="form-group" style="margin:0;">
                <label>Quantity Received</label>
                <input type="number" id="stockQty" class="form-control" value="10" min="1" required>
            </div>
            <div class="form-group" style="margin:0;">
                <label>Low Stock Alert Level</label>
                <input type="number" id="stockMinAlert" class="form-control" value="2" min="0">
            </div>
            <div class="form-group" style="margin:0;">
                <label>Wholesale Floor Price (ZAR)</label>
                <input type="number" id="stockUnitPrice" class="form-control" step="0.01" required placeholder="260" oninput="updateIntakeMarginPreview()">
            </div>
            <div class="form-group" style="margin:0;">
                <label>Retail Selling Price (ZAR)</label>
                <input type="number" id="stockSellingPrice" class="form-control" step="0.01" required placeholder="450" oninput="updateIntakeMarginPreview()">
            </div>
            <div class="form-group" style="margin:0;">
                <label>Est. Gross Margin (%)</label>
                <input type="text" id="stockMarginPreview" class="form-control" readonly placeholder="0.0%" style="color: var(--green-active); font-weight: 600;">
            </div>
            <div class="form-group" style="margin:0;">
                <label>Shelf / Bin Location</label>
                <input type="text" id="stockLocation" class="form-control" placeholder="e.g. A-12">
            </div>
        </div>
        <button type="submit" class="btn-submit" style="width: 100%; margin-top: 16px;">+ Stage Stock Line</button>
    </form>

    <!-- STAGED ITEMS BATCH PREVIEW TABLE -->
    <div style="margin-top: 20px;">
        <h4 style="margin-bottom: 10px;">Staged Batch Items</h4>
        <div class="table-responsive">
            <table class="table" id="stagedIntakeTable">
                <thead>
                    <tr>
                        <th>SKU</th>
                        <th>Product / Category</th>
                        <th>Supplier</th>
                        <th>Qty</th>
                        <th>Floor Price</th>
                        <th>Selling Price</th>
                        <th>Margin</th>
                        <th>Location</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="stagedIntakeTableBody">
                    <!-- Dynamic Staged Rows Populate Here -->
                </tbody>
            </table>
        </div>
        <div style="margin-top: 16px; display: flex; justify-content: flex-end; gap: 10px;">
            <button class="btn-secondary" onclick="clearStagedBatch()">Clear Staged Batch</button>
            <button class="btn-submit" style="width: auto; padding: 0 24px;" onclick="commitIntakeBatch()">Commit Batch to Database</button>
        </div>
    </div>
</div>
