<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retail Hub</title>
  <style>
    :root {
      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --primary: #0f172a;
      --accent: #2563eb;
      --success: #15803d;
      --danger: #dc2626;
      --border: #cbd5e1;
      --text: #1e293b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
    }

    /* Primary Navigation */
    header {
      background-color: var(--primary);
      padding: 0 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #fff;
    }

    .brand {
      font-weight: 700;
      font-size: 1.1rem;
    }

    .nav-tabs {
      display: flex;
    }

    .tab-btn {
      background: none;
      border: none;
      color: #94a3b8;
      padding: 16px 24px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: all 0.2s;
    }

    .tab-btn:hover {
      color: #fff;
    }

    .tab-btn.active {
      color: #fff;
      border-bottom-color: var(--accent);
      background: rgba(255, 255, 255, 0.05);
    }

    /* Container Views */
    main {
      padding: 24px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .view-section {
      display: none; /* Keeps sections fully separate */
    }

    .view-section.active {
      display: block;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
    }

    /* TABLE STYLES (LEDGER) */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid var(--border);
      text-align: left;
    }

    th {
      background-color: #f8fafc;
      font-weight: 600;
    }

    /* POS CASHIER LAYOUT */
    .pos-layout {
      display: grid;
      grid-template-columns: 1.8fr 1.2fr;
      gap: 20px;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 12px;
      margin-top: 16px;
      max-height: 520px;
      overflow-y: auto;
    }

    .product-card {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      text-align: center;
      cursor: pointer;
    }

    .product-card:hover {
      border-color: var(--accent);
      background: #eff6ff;
    }

    .product-card .price {
      font-weight: 700;
      color: var(--accent);
      margin-top: 6px;
    }

    .pos-summary {
      border-top: 2px solid var(--border);
      padding-top: 16px;
      margin-top: 20px;
    }

    .total-due {
      font-size: 1.5rem;
      font-weight: 800;
      display: flex;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .tender-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .btn-pay {
      padding: 14px;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
    }

    .btn-cash { background-color: var(--success); }
    .btn-card { background-color: var(--accent); }
    .btn-del { background-color: var(--danger); color: #fff; border: none; padding: 2px 8px; border-radius: 4px; cursor: pointer; }
    
    input[type="text"] {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
    }
  </style>
</head>
<body>

  <!-- TOP TAB NAVIGATION -->
  <header>
    <div class="brand">Store Management</div>
    <nav class="nav-tabs">
      <button class="tab-btn active" onclick="showView('dashboard')">Dashboard</button>
      <button class="tab-btn" onclick="showView('ledger')">Ledger</button>
      <button class="tab-btn" onclick="showView('pos-sell')">🛒 POS Sell</button>
    </nav>
  </header>

  <main>
    <!-- 1. DASHBOARD VIEW -->
    <section id="view-dashboard" class="view-section active">
      <div class="card">
        <h2>Dashboard</h2>
        <p>Select a tab above to manage transactions in the <strong>Ledger</strong> or process checkouts under <strong>POS Sell</strong>.</p>
      </div>
    </section>

    <!-- 2. LEDGER VIEW (SEPARATE) -->
    <section id="view-ledger" class="view-section">
      <div class="card">
        <h2>Sales Ledger</h2>
        <table>
          <thead>
            <tr>
              <th>Receipt Ref</th>
              <th>Date / Time</th>
              <th>Payment Type</th>
              <th>Total Amount</th>
            </tr>
          </thead>
          <tbody id="ledger-entries">
            <!-- Completed transactions populate here -->
          </tbody>
        </table>
      </div>
    </section>

    <!-- 3. POS SELL VIEW (SEPARATE) -->
    <section id="view-pos-sell" class="view-section">
      <div class="pos-layout">
        
        <!-- Left Panel: Product Selection -->
        <div class="card">
          <h2>Cashier Terminal</h2>
          <input type="text" id="barcode-search" placeholder="Scan barcode or search product..." autofocus>
          <div class="product-grid" id="catalog-list">
            <!-- Catalog renders here -->
          </div>
        </div>

        <!-- Right Panel: Cart & Tender -->
        <div class="card">
          <h2>Cart</h2>
          <table>
            <thead>
              <tr>
                <th>Item</th>
                <th>Qty</th>
                <th>Price</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="cart-rows">
              <!-- Active cart renders here -->
            </tbody>
          </table>

          <div class="pos-summary">
            <div class="total-due">
              <span>Total:</span>
              <span id="cart-total">R0.00</span>
            </div>
            <div class="tender-actions">
              <button class="btn-pay btn-cash" onclick="completeSale('Cash')">Cash Sale</button>
              <button class="btn-pay btn-card" onclick="completeSale('Card')">Card Sale</button>
            </div>
          </div>
        </div>

      </div>
    </section>
  </main>

  <script>
    // State
    const inventory = [
      { id: '1', name: 'Product A', price: 120.00 },
      { id: '2', name: 'Product B', price: 65.00 },
      { id: '3', name: 'Product C', price: 310.00 },
      { id: '4', name: 'Product D', price: 45.00 }
    ];

    let currentCart = [];
    let salesLedger = [];

    // VIEW SWITCHER (Completely isolates views)
    function showView(viewName) {
      document.querySelectorAll('.view-section').forEach(sec => sec.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));

      document.getElementById(`view-${viewName}`).classList.add('active');
      
      const targetBtn = Array.from(document.querySelectorAll('.tab-btn')).find(
        btn => btn.getAttribute('onclick').includes(viewName)
      );
      if (targetBtn) targetBtn.classList.add('active');

      if (viewName === 'pos-sell') {
        document.getElementById('barcode-search').focus();
      }
    }

    // CATALOG RENDER
    function initCatalog() {
      const container = document.getElementById('catalog-list');
      container.innerHTML = '';
      inventory.forEach(item => {
        const div = document.createElement('div');
        div.className = 'product-card';
        div.innerHTML = `<div>${item.name}</div><div class="price">R${item.price.toFixed(2)}</div>`;
        div.onclick = () => addToCart(item);
        container.appendChild(div);
      });
    }

    // CART OPERATIONS
    function addToCart(item) {
      const existing = currentCart.find(i => i.id === item.id);
      if (existing) {
        existing.qty += 1;
      } else {
        currentCart.push({ ...item, qty: 1 });
      }
      renderCart();
    }

    function removeFromCart(index) {
      currentCart.splice(index, 1);
      renderCart();
    }

    function renderCart() {
      const tbody = document.getElementById('cart-rows');
      tbody.innerHTML = '';
      let total = 0;

      currentCart.forEach((item, idx) => {
        const lineTotal = item.price * item.qty;
        total += lineTotal;
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${item.name}</td>
          <td>${item.qty}</td>
          <td>R${lineTotal.toFixed(2)}</td>
          <td><button class="btn-del" onclick="removeFromCart(${idx})">×</button></td>
        `;
        tbody.appendChild(row);
      });

      document.getElementById('cart-total').innerText = `R${total.toFixed(2)}`;
    }

    // SALE CHECKOUT -> POSTS TO LEDGER
    function completeSale(paymentMethod) {
      if (currentCart.length === 0) {
        alert("Cart is empty.");
        return;
      }

      const grandTotal = currentCart.reduce((sum, item) => sum + (item.price * item.qty), 0);
      
      // Record transaction
      const record = {
        ref: 'INV-' + Math.floor(100000 + Math.random() * 900000),
        dateTime: new Date().toLocaleString(),
        method: paymentMethod,
        amount: grandTotal
      };

      salesLedger.unshift(record);
      renderLedger();

      // Clear cart
      currentCart = [];
      renderCart();
      alert(`Sale recorded (${paymentMethod}). Check the Ledger tab to view entry.`);
    }

    // LEDGER RENDER
    function renderLedger() {
      const tbody = document.getElementById('ledger-entries');
      tbody.innerHTML = '';
      salesLedger.forEach(entry => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td><strong>${entry.ref}</strong></td>
          <td>${entry.dateTime}</td>
          <td>${entry.method}</td>
          <td>R${entry.amount.toFixed(2)}</td>
        `;
        tbody.appendChild(row);
      });
    }

    window.onload = () => {
      initCatalog();
    };
  </script>
</body>
</html>
