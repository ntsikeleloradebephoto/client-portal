<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nguni Homeware | Control & Enterprise POS Hub</title>
    <link rel="icon" type="image/png" href="logo.png">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root {
            --bg-dark: #0b0c0e;
            --panel-dark: #121417;
            --gold-primary: #d4af37;
            --gold-light: #f3c649;
            --text-light: #f5f5f5;
            --text-muted: #a0a5ad;
            --border-gold: #3a3219;
            --green-active: #2e7d32;
            --green-light: #81c784;
            --red-alert: #d32f2f;
            --red-light: #ef5350;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            margin: 0;
            padding: 24px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-gold);
            padding-bottom: 16px;
            margin-bottom: 24px;
        }

        .header-title { display: flex; align-items: center; gap: 12px; }
        .header h1 { font-size: 18px; letter-spacing: 2px; text-transform: uppercase; color: var(--gold-primary); margin: 0; }
        .role-badge { background: #08090a; border: 1px solid var(--border-gold); color: var(--gold-light); padding: 6px 12px; border-radius: 4px; font-size: 11px; font-weight: bold; display: flex; align-items: center; gap: 10px; }

        .tabs { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; margin-bottom: 24px; }
        .tab-btn { background: var(--panel-dark); border: 1px solid var(--border-gold); color: var(--text-muted); padding: 12px 6px; font-weight: 700; font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; cursor: pointer; border-radius: 4px; transition: all 0.2s ease; text-align: center; }
        .tab-btn.active { background: var(--gold-primary); color: #000; border-color: var(--gold-light); }

        .tab-content { display: none; background: var(--panel-dark); border: 1px solid var(--border-gold); padding: 24px; border-radius: 6px; }
        .tab-content.active { display: block; }

        .section-title { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--gold-primary); margin-top: 0; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }

        .summary-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
        .summary-card { background: #08090a; border: 1px solid #1f2228; padding: 16px; border-radius: 4px; }
        .summary-label { font-size: 9px; text-transform: uppercase; color: var(--text-muted); letter-spacing: 1px; }
        .summary-val { font-size: 20px; font-weight: 700; margin-top: 6px; }

        .ledger-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .ledger-table th { text-align: left; padding: 12px; font-size: 10px; text-transform: uppercase; color: var(--gold-primary); letter-spacing: 1px; border-bottom: 1px solid var(--border-gold); }
        .ledger-table td { padding: 14px 12px; border-bottom: 1px solid #1f2228; vertical-align: middle; }

        .status-badge { font-size: 10px; font-weight: 700; text-transform: uppercase; padding: 2px 6px; border-radius: 3px; }
        .status-pending { color: var(--gold-light); background: rgba(212, 175, 55, 0.1); }
        .status-settled { color: var(--green-light); background: rgba(46, 125, 50, 0.2); }
        .status-returned { color: var(--red-light); background: rgba(211, 47, 47, 0.2); }

        .btn-action { padding: 6px 10px; font-size: 10px; font-weight: 700; text-transform: uppercase; border: none; border-radius: 3px; cursor: pointer; margin-right: 4px; }
        .btn-pending { background: #d4af37; color: #000; }
        .btn-settled { background: #2e7d32; color: #fff; }
        .btn-delete { background: #d32f2f; color: #fff; }
        .btn-export { background: var(--gold-primary); color: #000; font-weight: bold; cursor: pointer; border: none; padding: 8px 14px; border-radius: 4px; text-transform: uppercase; font-size: 10px; }
        .btn-sec { background: transparent; border: 1px solid var(--border-gold); color: var(--gold-light); cursor: pointer; padding: 4px 8px; border-radius: 3px; font-size: 10px; font-weight: bold; }

        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 10px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 6px; }
        .form-control { width: 100%; padding: 10px; background: #08090a; border: 1px solid #1f2228; color: #fff; border-radius: 4px; box-sizing: border-box; }
        .btn-submit { background: var(--gold-primary); color: #000; font-weight: 700; padding: 12px 20px; border: none; border-radius: 4px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; justify-content: center; align-items: center; z-index: 999; }
        .modal-card { background: var(--panel-dark); border: 2px solid var(--border-gold); padding: 30px; border-radius: 6px; width: 340px; text-align: center; }

        .table-input { background: #08090a; border: 1px solid #333; color: #fff; padding: 6px; border-radius: 3px; font-size: 12px; width: 90%; }

        @media print {
            body * { visibility: hidden; }
            #receiptModal, #receiptModal * { visibility: visible; }
            #receiptModal { position: absolute; left: 0; top: 0; width: 100%; background: #fff; color: #000; padding: 0; }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-title">
            <img src="logo.png" alt="Nguni Logo" style="height: 36px;" onerror="this.style.display='none'">
            <h1>NGUNI HOMEWARE | ENTERPRISE POS HUB</h1>
        </div>
        <div class="role-badge">
            <span id="roleLabel">ACTIVE USER: NOT LOGGED IN</span>
            <button class="btn-sec" onclick="openLoginModal()">SWITCH / LOGIN USER</button>
        </div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('tab1')">1. POS SCAN OUT</button>
        <button class="tab-btn" onclick="switchTab('tab2')">2. STOCK INTAKE</button>
        <button class="tab-btn" id="btnTab3" style="display: none;" onclick="switchTab('tab3')">3. SETTLEMENT LEDGER</button>
        <button class="tab-btn" id="btnTab4" style="display: none;" onclick="switchTab('tab4')">4. STOCK ON-HAND</button>
        <button class="tab-btn" id="btnTab5" style="display: none;" onclick="switchTab('tab5')">5. STAFF PROFILES</button>
        <button class="tab-btn" id="btnTab6" style="display: none;" onclick="switchTab('tab6')">6. AUDIT LOGS</button>
        <button class="tab-btn" id="btnTab7" onclick="switchTab('tab7')">7. RETURNS & DAMAGES</button>
    </div>

    <div id="tab1" class="tab-content active">
        <div class="section-title">POS Dispatch / Scan Out</div>
        <form id="posForm" onsubmit="handlePosSubmit(event)">
            <div class="form-group">
                <label>Scan Barcode / Item Number (Auto-Retrieves Details)</label>
                <div style="display: flex; gap: 8px;">
                    <input type="text" id="posBarcodeScan" class="form-control" placeholder="Scan Barcode or Type Item No..." oninput="handleBarcodeScanInput()" autofocus>
                    <button type="button" class="btn-sec" onclick="toggleCameraScanner()" style="white-space: nowrap; height: 42px;">📷 Scan with Camera</button>
                </div>
            </div>

            <div id="cameraScannerModal" style="display: none; background: #000; border: 1px solid var(--border-gold); padding: 12px; border-radius: 4px; margin-bottom: 16px; text-align: center;">
                <div id="interactive-camera" style="width: 100%; max-width: 400px; margin: 0 auto;"></div>
                <button type="button" class="btn-sec" onclick="stopCameraScanner()" style="margin-top: 10px; color: var(--red-light); border-color: var(--red-light);">Close Camera</button>
            </div>

            <div class="form-group">
                <label>Select Inventory Item (Live Stock)</label>
                <select id="posItemSelect" class="form-control" onchange="autofillPosDetails()" required>
                    <option value="">-- Choose Item from Inventory --</option>
                </select>
            </div>
