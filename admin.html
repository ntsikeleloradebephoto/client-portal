<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nguni Homeware - POS & Inventory Hub</title>
    <link rel="icon" type="image/png" href="logo.png">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <style>
        :root {
            --bg-dark: #0b0c0e;
            --panel-dark: #121417;
            --gold-primary: #d4af37;
            --gold-light: #f3c649;
            --text-light: #f5f5f5;
            --text-muted: #a0a5ad;
            --border-gold: #3a3219;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            margin: 0;
            padding: 24px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-gold);
            padding-bottom: 16px;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 18px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--gold-primary);
            margin: 0;
        }

        .pos-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        @media (max-width: 900px) {
            .pos-grid { grid-template-columns: 1fr; }
        }

        .panel {
            background: var(--panel-dark);
            border: 1px solid var(--border-gold);
            border-top: 3px solid var(--gold-primary);
            padding: 24px;
            border-radius: 6px;
        }

        .panel-title {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--gold-primary);
            margin-top: 0;
            margin-bottom: 16px;
            border-bottom: 1px solid #1f2228;
            padding-bottom: 8px;
        }

        .mode-toggle {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        .mode-btn {
            flex: 1;
            padding: 10px;
            background: #08090a;
            border: 1px solid var(--border-gold);
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            border-radius: 4px;
            cursor: pointer;
        }

        .mode-btn.active {
            background: var(--gold-primary);
            color: #000;
        }

        .form-group { margin-bottom: 14px; }

        label {
            display: block;
            font-size: 11px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            background: #08090a;
            border: 1px solid #2a2e37;
            border-radius: 4px;
            color: #fff;
            font-size: 13px;
            box-sizing: border-box;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--gold-primary);
        }

        .price-badge-box {
            background: #08090a;
            border: 1px dashed var(--border-gold);
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 16px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            font-size: 12px;
        }

        .price-val {
            font-weight: 700;
            color: var(--gold-light);
        }

        button.action-btn {
            width: 100%;
            padding: 12px;
            background: var(--gold-primary);
            color: #000;
            border: none;
            border-radius: 4px;
            font-weight: 700;
            font-size: 12px;
            text-transform: uppercase;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            margin-top: 10px;
        }

        th, td {
            text-align: left;
            padding: 8px;
            border-bottom: 1px solid #1f2228;
        }

        th { color: var(--gold-primary); text-transform: uppercase; font-size: 10px; }

        #statusMsg {
            margin-top: 12px;
            font-size: 12px;
            font-weight: 600;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="header">
        <div style="display: flex; align-items: center; gap: 12px;">
            <img src="logo.png" alt="Nguni Logo" style="height: 36px;" onerror="this.style.display='none'">
            <h1>NGUNI HOMEWARE <span>| POS & INVENTORY HUB</span></h1>
        </div>
    </div>

    <div class="pos-grid">
        
        <!-- LEFT PANEL: POS DISPATCH & INTAKE -->
        <div class="panel">
            <div class="mode-toggle">
                <button type="button" class="mode-btn active" id="btnPosMode" onclick="switchMode('POS')">1. POS Scan Out</button>
                <button type="button" class="mode-btn" id="btnStockMode" onclick="switchMode('STOCK')">2. Stock In Intake</button>
            </div>

            <!-- MODE 1: POS SCAN & DISPATCH -->
            <form id="posForm">
                <div class="form-group">
                    <label>Barcode / SKU Scan Input</label>
                    <input type="text" id="scanInput" placeholder="Scan Barcode or Type SKU (e.g. SKU-POT-01)" autofocus required>
                </div>

                <div class="price-badge-box">
                    <div>Supplier Floor Price: <br><span class="price-val" id="posSupplierPrice">R 0.00</span></div>
                    <div>Marketplace Price: <br><span class="price-val" id="posMarketplacePrice">R 0.00</span></div>
                </div>

                <div class="form-group">
                    <label>Order Reference Number</label>
                    <input type="text" id="orderNum" placeholder="e.g. #AMZ-8821" required>
                </div>

                <div class="form-group">
                    <label>Marketplace Channel</label>
                    <select id="marketplace" onchange="updatePriceDisplay()">
                        <option value="Amazon">Amazon</option>
                        <option value="Makro">Makro</option>
                        <option value="Takealot">Takealot</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Quantity Dispatched</label>
                    <input type="number" id="dispatchQty" value="1" min="1" required>
                </div>

                <button type="submit" class="action-btn">Scan Out & Log Dispatch</button>
            </form>

            <!-- MODE 2: STOCK IN INTAKE -->
            <form id="stockForm" style="display: none;">
                <div class="form-group">
                    <label>SKU Code</label>
                    <input type="text" id="addSku" placeholder="e.g. SKU-POT-01" required>
                </div>
                <div class="form-group">
                    <label>Barcode ID</label>
                    <input type="text" id="addBarcode" placeholder="e.g. 600123456789">
                </div>
                <div class="form-group">
                    <label>Item Name</label>
                    <input type="text" id="addName" placeholder="e.g. Cast Iron Pot 3L" required>
                </div>
                <div class="form-group">
                    <label>Stock Quantity to Add</label>
                    <input type="number" id="addQty" value="10" required>
                </div>
                <div class="form-group">
                    <label>Supplier Wholesale Floor Price (ZAR)</label>
                    <input type="number" step="0.01" id="addWholesale" placeholder="e.g. 520.00" required>
                </div>
                <div class="form-group">
                    <label>Amazon Price (ZAR)</label>
                    <input type="number" step="0.01" id="addAmazon" placeholder="e.g. 850.00">
                </div>
                <div class="form-group">
                    <label>Makro Price (ZAR)</label>
                    <input type="number" step="0.01" id="addMakro" placeholder="e.g. 820.00">
                </div>
                <button type="submit" class="action-btn">Save SKU Inventory</button>
            </form>

            <div id="statusMsg"></div>
        </div>

        <!-- RIGHT PANEL: LIVE INVENTORY TRACKER -->
        <div class="panel">
            <div class="panel-title">Real-Time Inventory Status</div>
            <table>
                <thead>
                    <tr>
                        <th>SKU / Item</th>
                        <th>Stock Qty</th>
                        <th>Supplier Cost</th>
                        <th>Amazon</th>
                    </tr>
                </thead>
                <tbody id="inventoryTable">
                    <tr><td colspan="4" style="color: var(--text-muted);">Loading inventory...</td></tr>
                </tbody>
            </table>
        </div>

    </div>

    <script>
        const SUPABASE_URL = 'https://aivsmcdhxfdccsbqmejt.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_NDE9uLsqMD2QiIa6LMw-Lw_IBOmeebV';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let inventoryList = [];
        let selectedItem = null;

        function switchMode(mode) {
            document.getElementById('statusMsg').innerText = '';
            if (mode === 'POS') {
                document.getElementById('posForm').style.display = 'block';
                document.getElementById('stockForm').style.display = 'none';
                document.getElementById('btnPosMode').classList.add('active');
                document.getElementById('btnStockMode').classList.remove('active');
            } else {
                document.getElementById('posForm').style.display = 'none';
                document.getElementById('stockForm').style.display = 'block';
                document.getElementById('btnPosMode').classList.remove('active');
                document.getElementById('btnStockMode').classList.add('active');
            }
        }

        async function fetchInventory() {
            const { data, error } = await supabaseClient.from('inventory').select('*').order('created_at', { ascending: false });
            if (!error && data) {
                inventoryList = data;
                renderInventoryTable();
            }
        }

        function renderInventoryTable() {
            const tbody = document.getElementById('inventoryTable');
            tbody.innerHTML = '';
            inventoryList.forEach(item => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><b>${item.sku}</b><br><span style="color: var(--text-muted);">${item.item_name}</span></td>
                    <td style="color: ${item.stock_quantity < 5 ? '#ff5555' : '#81c784'}; font-weight: bold;">${item.stock_quantity} Units</td>
                    <td>R ${parseFloat(item.wholesale_floor_zar).toFixed(2)}</td>
                    <td style="color: var(--gold-light);">R ${parseFloat(item.amazon_price_zar || 0).toFixed(2)}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Live Lookup on Barcode Scan or Typing SKU
        document.getElementById('scanInput').addEventListener('input', (e) => {
            const query = e.target.value.trim().toLowerCase();
            selectedItem = inventoryList.find(i => 
                (i.barcode && i.barcode.toLowerCase() === query) || 
                (i.sku && i.sku.toLowerCase() === query)
            );

            updatePriceDisplay();
        });

        function updatePriceDisplay() {
            if (selectedItem) {
                const channel = document.getElementById('marketplace').value.toLowerCase();
                let channelPrice = selectedItem.amazon_price_zar;
                if (channel === 'makro') channelPrice = selectedItem.makro_price_zar;

                document.getElementById('posSupplierPrice').innerText = `R ${parseFloat(selectedItem.wholesale_floor_zar).toFixed(2)}`;
                document.getElementById('posMarketplacePrice').innerText = `R ${parseFloat(channelPrice || selectedItem.wholesale_floor_zar).toFixed(2)}`;
            } else {
                document.getElementById('posSupplierPrice').innerText = 'R 0.00';
                document.getElementById('posMarketplacePrice').innerText = 'R 0.00';
            }
        }

        // POS SCAN OUT & DEDUCT STOCK
        document.getElementById('posForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const statusMsg = document.getElementById('statusMsg');
            const qty = parseInt(document.getElementById('dispatchQty').value);

            if (!selectedItem) {
                statusMsg.style.color = '#ff5555';
                statusMsg.innerText = '❌ SKU / Barcode not found in inventory!';
                return;
            }

            if (selectedItem.stock_quantity < qty) {
                statusMsg.style.color = '#ff5555';
                statusMsg.innerText = `❌ Insufficient stock! Only ${selectedItem.stock_quantity} units available.`;
                return;
            }

            // 1. Log Order
            const { error: orderErr } = await supabaseClient.from('orders').insert([{
                item_name: selectedItem.item_name,
                order_number: document.getElementById('orderNum').value,
                marketplace: document.getElementById('marketplace').value,
                wholesale_floor_zar: selectedItem.wholesale_floor_zar * qty,
                payout_status: 'ESCROW PENDING',
                inventory_id: selectedItem.id,
                quantity_dispatched: qty
            }]);

            if (orderErr) {
                statusMsg.style.color = '#ff5555';
                statusMsg.innerText = '❌ Order Error: ' + orderErr.message;
                return;
            }

            // 2. Deduct Inventory Stock
            const { error: stockErr } = await supabaseClient.from('inventory')
                .update({ stock_quantity: selectedItem.stock_quantity - qty })
                .eq('id', selectedItem.id);

            if (!stockErr) {
                statusMsg.style.color = '#55ff55';
                statusMsg.innerText = '✅ Dispatched & Stock Updated!';
                document.getElementById('posForm').reset();
                selectedItem = null;
                updatePriceDisplay();
                fetchInventory();
            }
        });

        // INTAKE NEW STOCK
        document.getElementById('stockForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const statusMsg = document.getElementById('statusMsg');

            const newStock = {
                sku: document.getElementById('addSku').value,
                barcode: document.getElementById('addBarcode').value || null,
                item_name: document.getElementById('addName').value,
                stock_quantity: parseInt(document.getElementById('addQty').value),
                wholesale_floor_zar: parseFloat(document.getElementById('addWholesale').value),
                amazon_price_zar: parseFloat(document.getElementById('addAmazon').value || 0),
                makro_price_zar: parseFloat(document.getElementById('addMakro').value || 0)
            };

            const { error } = await supabaseClient.from('inventory').upsert([newStock], { onConflict: 'sku' });

            if (error) {
                statusMsg.style.color = '#ff5555';
                statusMsg.innerText = '❌ Stock Error: ' + error.message;
            } else {
                statusMsg.style.color = '#55ff55';
                statusMsg.innerText = '✅ SKU Saved to Inventory!';
                document.getElementById('stockForm').reset();
                fetchInventory();
            }
        });

        fetchInventory();
        supabaseClient.channel('inv_sync').on('postgres_changes', { event: '*', schema: 'public', table: 'inventory' }, fetchInventory).subscribe();
    </script>
</body>
</html>
