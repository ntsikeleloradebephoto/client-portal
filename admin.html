<script>
    const SUPABASE_URL = 'https://aivsmcdhxfdccsbqmejt.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_NDE9uLsqMD2QiIa6LMw-Lw_IBOmeebV';
    
    let supabaseClient;
    try {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    } catch (err) {
        console.error("Supabase Initialization Error:", err);
    }

    const PLATFORM_FEE = 230;
    let currentUser = null;
    let cachedOrders = [];
    let cachedInventory = [];
    let idleTimer = null;

    function resetIdleTimer() {
        clearTimeout(idleTimer);
        idleTimer = setTimeout(() => {
            alert('Session timed out due to 5 minutes of inactivity.');
            openLoginModal();
        }, 5 * 60 * 1000);
    }

    window.onload = function() {
        resetIdleTimer();
        openLoginModal();
        fetchAdminOrders();
        
        if (supabaseClient) {
            supabaseClient.channel('admin_realtime').on('postgres_changes', { event: '*', schema: 'public' }, () => {
                fetchAdminOrders();
            }).subscribe();
        }
    };

    document.onmousemove = resetIdleTimer;
    document.onkeypress = resetIdleTimer;

    function openLoginModal() {
        currentUser = null;
        document.getElementById('roleLabel').innerText = 'ACTIVE USER: NOT LOGGED IN';
        document.getElementById('userPinInput').value = '';
        document.getElementById('loginModal').style.display = 'flex';
    }

    function closeModal(id) { 
        document.getElementById(id).style.display = 'none'; 
    }

    async function authenticateUserPin() {
        const enteredPin = document.getElementById('userPinInput').value;

        if (enteredPin === '1234') {
            currentUser = { full_name: 'Default Manager', role: 'manager' };
            applyUserSession();
            return;
        } else if (enteredPin === '0000') {
            currentUser = { full_name: 'Floor Staff', role: 'staff' };
            applyUserSession();
            return;
        }

        const { data: staffList, error } = await supabaseClient.from('staff_profiles').select('*').eq('pin_code', enteredPin);

        if (error || !staffList || staffList.length === 0) {
            alert('Invalid PIN code.');
            return;
        }

        currentUser = staffList[0];
        applyUserSession();
    }

    function applyUserSession() {
        document.getElementById('roleLabel').innerText = `USER: ${currentUser.full_name.toUpperCase()} (${currentUser.role.toUpperCase()})`;

        if (currentUser.role === 'manager') {
            ['btnTab3', 'btnTab4', 'btnTab5', 'btnTab6'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.style.display = 'block';
            });
        } else {
            ['btnTab3', 'btnTab4', 'btnTab5', 'btnTab6'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.style.display = 'none';
            });
            switchTab('tab1');
        }

        closeModal('loginModal');
        logAuditAction(`User logged in (${currentUser.full_name})`);
        fetchAdminOrders();
        fetchStaffProfiles();
    }

    function switchTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        const targetBtn = Array.from(document.querySelectorAll('.tab-btn')).find(b => b.getAttribute('onclick')?.includes(tabId));
        if (targetBtn) targetBtn.classList.add('active');
    }

    async function fetchAdminOrders() {
        if (!supabaseClient) return;
        const { data: orders } = await supabaseClient.from('orders').select('*').order('created_at', { ascending: false });
        const { data: inventory } = await supabaseClient.from('inventory').select('*');

        cachedOrders = orders || [];
        cachedInventory = inventory || [];

        populatePosItemDropdown(cachedInventory, cachedOrders);
        renderAdminOrders(cachedOrders);
        renderStockTable(cachedInventory, cachedOrders);
        fetchAuditLogs();
    }

    function populatePosItemDropdown(inventory, orders) {
        const select = document.getElementById('posItemSelect');
        if (!select) return;
        select.innerHTML = '<option value="">-- Choose Item from Inventory --</option>';

        const stockMap = {};
        inventory.forEach(item => {
            const name = (item.item_name || item.item_description || item.sku || 'Unknown Item').trim();
            stockMap[name] = stockMap[name] || { name: name, intake: 0, dispatched: 0, supplier: item.supplier || 'General', price: item.unit_price || item.cost_price || 0 };
            stockMap[name].intake += (parseInt(item.quantity_allocated || item.quantity) || 0);
        });

        orders.forEach(order => {
            if (order.payout_status !== 'RETURNED / CANCELLED') {
                const name = (order.item_name || '').trim();
                if (stockMap[name]) stockMap[name].dispatched += (parseInt(order.quantity_dispatched) || 1);
            }
        });

        Object.keys(stockMap).forEach(k => {
            const item = stockMap[k];
            const onHand = item.intake - item.dispatched;
            const option = document.createElement('option');
            option.value = item.name;
            option.dataset.price = item.price;
            option.dataset.supplier = item.supplier;
            option.dataset.onhand = onHand;
            option.innerText = `${item.name} (${onHand} in stock) - R${item.price}`;
            if (onHand <= 0) option.disabled = true;
            select.appendChild(option);
        });
    }

    function autofillPosDetails() {
        const select = document.getElementById('posItemSelect');
        const selected = select.options[select.selectedIndex];
        if (selected && selected.value) {
            document.getElementById('posWholesale').value = selected.dataset.price || 0;
            document.getElementById('posSupplier').value = selected.dataset.supplier || 'General Wholesaler';
        }
    }

    function renderAdminOrders(orders) {
        let pendingSum = 0;
        let settledSum = 0;
        const start = document.getElementById('filterStartDate')?.value;
        const end = document.getElementById('filterEndDate')?.value;

        const tbody = document.getElementById('adminOrderTable');
        if (!tbody) return;
        tbody.innerHTML = '';

        const filtered = orders.filter(o => {
            if (!o.created_at) return true;
            const d = o.created_at.slice(0, 10);
            if (start && d < start) return false;
            if (end && d > end) return false;
            return true;
        });

        filtered.forEach(order => {
            const wholesaleVal = parseFloat(order.wholesale_floor_zar) || 0;
            const qty = parseInt(order.quantity_dispatched) || 1;
            const status = order.payout_status || 'ESCROW PENDING';

            if (status === 'SETTLED') settledSum += wholesaleVal;
            else if (status === 'ESCROW PENDING') pendingSum += wholesaleVal;

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>
                    <div style="font-weight: bold;">${order.item_name || 'Consignment Item'}</div>
                    <div style="font-size: 11px; color: var(--text-muted);">${order.order_number || 'N/A'}</div>
                </td>
                <td>${order.supplier || 'Consignor'}</td>
                <td>${new Date(order.created_at).toLocaleDateString()}</td>
                <td style="color: var(--gold-light); font-weight: bold;">${order.processed_by || 'Unassigned'}</td>
                <td>${qty}</td>
                <td style="font-weight: 700;">R ${wholesaleVal.toFixed(2)}</td>
                <td><span class="status-badge ${status === 'SETTLED' ? 'status-settled' : 'status-pending'}">${status}</span></td>
                <td>
                    <button class="btn-action ${status === 'SETTLED' ? 'btn-pending' : 'btn-settled'}" onclick="updateStatus('${order.id}', '${status === 'SETTLED' ? 'ESCROW PENDING' : 'SETTLED'}')">${status === 'SETTLED' ? 'Pending' : 'Settle'}</button>
                    <button class="btn-action btn-delete" onclick="deleteOrder('${order.id}')">Delete</button>
                </td>
            `;
            tbody.appendChild(tr);
        });

        const netPayout = Math.max(0, pendingSum - PLATFORM_FEE);
        document.getElementById('adminOwed').innerText = `R ${pendingSum.toFixed(2)}`;
        document.getElementById('adminSettled').innerText = `R ${settledSum.toFixed(2)}`;
        document.getElementById('adminNet').innerText = `R ${netPayout.toFixed(2)}`;
    }

    function renderStockTable(inventory, orders) {
        const tbody = document.getElementById('stockTableBody');
        if (!tbody) return;
        tbody.innerHTML = '';
        const stockMap = {};

        inventory.forEach(item => {
            const name = (item.item_name || item.item_description || item.sku || 'Unknown').trim();
            stockMap[name] = stockMap[name] || { name: name, supplier: item.supplier || 'General', intake: 0, dispatched: 0 };
            stockMap[name].intake += (parseInt(item.quantity_allocated || item.quantity) || 0);
        });

        orders.forEach(order => {
            if (order.payout_status !== 'RETURNED / CANCELLED') {
                const name = (order.item_name || 'Unknown').trim();
                if (stockMap[name]) stockMap[name].dispatched += (parseInt(order.quantity_dispatched) || 1);
            }
        });

        Object.keys(stockMap).forEach(k => {
            const item = stockMap[k];
            const onHand = item.intake - item.dispatched;
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td style="font-weight: bold;">${item.name}</td>
                <td>${item.supplier}</td>
                <td>${item.intake} Units</td>
                <td>${item.dispatched} Units</td>
                <td style="font-weight: bold; font-size: 14px;">${onHand} Units</td>
                <td>${onHand <= 0 ? '<span style="color: var(--red-light); font-weight: bold;">OUT OF STOCK</span>' : '<span style="color: var(--green-light); font-weight: bold;">HEALTHY</span>'}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    async function handlePosSubmit(e) {
        e.preventDefault();
        if (!currentUser) return openLoginModal();

        const select = document.getElementById('posItemSelect');
        const selected = select.options[select.selectedIndex];
        if (!selected || !selected.value) return alert('Select an inventory item.');

        const onHand = parseInt(selected.dataset.onhand);
        const qty = parseInt(document.getElementById('posQty').value);

        if (qty > onHand) return alert(`Cannot dispatch ${qty} units. Only ${onHand} in stock.`);

        const itemName = select.value;
        const orderRef = document.getElementById('posOrderRef').value;
        const wholesale = parseFloat(document.getElementById('posWholesale').value);
        const supplier = document.getElementById('posSupplier').value;

        const { error } = await supabaseClient.from('orders').insert([{
            item_name: itemName,
            order_number: orderRef,
            quantity_dispatched: qty,
            wholesale_floor_zar: wholesale,
            supplier: supplier,
            payout_status: 'ESCROW PENDING',
            processed_by: currentUser.full_name
        }]);

        if (error) {
            alert('Error: ' + error.message);
        } else {
            logAuditAction(`Dispatched Order #${orderRef} (${itemName}) by ${currentUser.full_name}`);
            showReceipt(orderRef, itemName, qty, wholesale, currentUser.full_name);
            document.getElementById('posForm').reset();
            fetchAdminOrders();
        }
    }

    function showReceipt(ref, item, qty, price, cashier) {
        const content = document.getElementById('receiptContent');
        content.innerHTML = `
            <p><strong>DATE:</strong> ${new Date().toLocaleString()}</p>
            <p><strong>REF #:</strong> ${ref}</p>
            <p><strong>CASHIER:</strong> ${cashier}</p>
            <hr style="border: 0; border-top: 1px dashed #000;">
            <p><strong>ITEM:</strong> ${item}</p>
            <p><strong>QTY:</strong> ${qty} x R${price.toFixed(2)}</p>
            <p><strong>TOTAL PAID:</strong> R${(qty * price).toFixed(2)}</p>
        `;
        document.getElementById('receiptModal').style.display = 'flex';
    }

    async function handleStockSubmit(e) {
        e.preventDefault();
        if (!currentUser) return openLoginModal();

        const stockName = document.getElementById('stockName').value;
        const qty = parseInt(document.getElementById('stockQty').value);
        const unitPrice = parseFloat(document.getElementById('stockUnitPrice').value);
        const supplier = document.getElementById('stockSupplier').value;

        const generatedSku = stockName.toUpperCase().replace(/[^A-Z0-9]/g, '-').slice(0, 12) + '-' + Math.floor(100 + Math.random() * 900);

        const { error } = await supabaseClient.from('inventory').insert([{
            sku: generatedSku,
            item_name: stockName,
            item_description: stockName,
            quantity_allocated: qty,
            quantity: qty,
            unit_price: unitPrice,
            cost_price: unitPrice,
            supplier: supplier,
            added_by: currentUser.full_name
        }]);

        if (error) {
            alert('Error: ' + error.message);
        } else {
            logAuditAction(`Added stock ${stockName} (${qty} units) by ${currentUser.full_name}`);
            alert('Inventory added!');
            document.getElementById('stockForm').reset();
            fetchAdminOrders();
        }
    }

    async function logAuditAction(actionText) {
        if (!currentUser || !supabaseClient) return;
        try {
            await supabaseClient.from('audit_logs').insert([{ 
                user_name: currentUser.full_name, 
                action: actionText 
            }]);
        } catch (err) {
            console.warn('Audit logging bypassed:', err);
        }
    }

    async function fetchAuditLogs() {
        if (!supabaseClient) return;
        try {
            const { data: logs } = await supabaseClient.from('audit_logs').select('*').order('created_at', { ascending: false }).limit(20);
            const tbody = document.getElementById('auditTableBody');
            if (!tbody) return;
            tbody.innerHTML = '';
            if (!logs || logs.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" style="color: var(--text-muted);">No audit logs recorded.</td></tr>';
                return;
            }
            logs.forEach(l => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${new Date(l.created_at).toLocaleString()}</td>
                    <td style="color: var(--gold-light); font-weight: bold;">${l.user_name}</td>
                    <td>${l.action}</td>
                `;
                tbody.appendChild(tr);
            });
        } catch (err) {
            console.warn('Unable to fetch audit logs:', err);
        }
    }

    async function fetchStaffProfiles() {
        if (!supabaseClient) return;
        const { data: profiles } = await supabaseClient.from('staff_profiles').select('*').order('created_at', { ascending: false });
        const tbody = document.getElementById('staffProfileTable');
        if (!tbody) return;
        tbody.innerHTML = '';
        if (!profiles) return;
        profiles.forEach(p => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td style="font-weight: bold; color: var(--gold-light);">${p.full_name}</td>
                <td style="text-transform: uppercase;">${p.role}</td>
                <td>${new Date(p.created_at).toLocaleDateString()}</td>
                <td><button class="btn-action btn-delete" onclick="deleteStaffProfile('${p.id}')">Delete</button></td>
            `;
            tbody.appendChild(tr);
        });
    }

    async function handleCreateStaff(e) {
        e.preventDefault();
        const name = document.getElementById('staffNameInput').value;
        const pin = document.getElementById('staffPinInput').value;
        const role = document.getElementById('staffRoleSelect').value;

        const { error } = await supabaseClient.from('staff_profiles').insert([{ full_name: name, pin_code: pin, role: role }]);
        if (error) alert('Error: ' + error.message);
        else {
            logAuditAction(`Created user profile (${name})`);
            alert('Staff profile created!');
            document.getElementById('createStaffForm').reset();
            fetchStaffProfiles();
        }
    }

    async function deleteStaffProfile(id) {
        if (!confirm('Delete staff profile?')) return;
        await supabaseClient.from('staff_profiles').delete().eq('id', id);
        fetchStaffProfiles();
    }

    async function updateStatus(orderId, newStatus) {
        await supabaseClient.from('orders').update({ payout_status: newStatus }).eq('id', orderId);
        logAuditAction(`Updated order status to ${newStatus}`);
        fetchAdminOrders();
    }

    async function deleteOrder(orderId) {
        if (!confirm('Delete order record?')) return;
        await supabaseClient.from('orders').delete().eq('id', orderId);
        logAuditAction('Deleted order record');
        fetchAdminOrders();
    }

    function exportSupplierStatement() {
        if (cachedOrders.length === 0) return alert('No orders to export.');
        let csv = "data:text/csv;charset=utf-8,Order Ref,Item,Supplier,Date,Processed By,Quantity,Wholesale Amount (ZAR),Status\n";
        cachedOrders.forEach(o => {
            csv += `"${o.order_number || ''}","${o.item_name || ''}","${o.supplier || ''}","${o.created_at || ''}","${o.processed_by || ''}",${o.quantity_dispatched || 1},${o.wholesale_floor_zar || 0},"${o.payout_status || ''}"\n`;
        });
        const link = document.createElement("a");
        link.setAttribute("href", encodeURI(csv));
        link.setAttribute("download", `Nguni_Supplier_Ledger_${new Date().toISOString().slice(0,10)}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }
</script>
