<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS Checkout System</title>
    <style>
        :root {
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --primary-blue: #2563eb;
            --green-active: #16a34a;
            --red-alert: #dc2626;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .checkout-container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            width: 100%;
            max-width: 420px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-main);
        }

        .form-control {
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-control:focus {
            border-color: var(--primary-blue);
        }

        .tender-options {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .tender-btn {
            flex: 1;
            padding: 10px;
            border: 1px solid var(--border-color);
            background-color: #f8fafc;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tender-btn.active {
            background-color: var(--primary-blue);
            color: #ffffff;
            border-color: var(--primary-blue);
        }

        .summary-box {
            background-color: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: var(--green-active);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-submit:hover {
            background-color: #15803d;
        }

        #notification {
            display: none;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 12px;
            font-size: 13px;
            font-weight: 500;
        }

        #notification.error {
            background-color: #fef2f2;
            color: var(--red-alert);
            border: 1px solid #fecaca;
        }

        #notification.success {
            background-color: #f0fdf4;
            color: var(--green-active);
            border: 1px solid #bbf7d0;
        }
    </style>
</head>
<body>

<div class="checkout-container">
    <div id="notification"></div>

    <div class="form-group" style="margin-bottom: 12px;">
        <label for="posOrderRef">Order Reference (Optional)</label>
        <input type="text" id="posOrderRef" class="form-control" placeholder="e.g. POS-1001">
    </div>

    <div class="summary-box">
        <span style="font-size: 14px; font-weight: 500;">Grand Total</span>
        <span id="grandTotalDisplay" style="font-size: 18px; font-weight: 700;">R 150.00</span>
    </div>

    <div>
        <label style="font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-muted); display: block; margin-bottom: 6px;">Payment Tender Method</label>
        <div class="tender-options">
            <button type="button" class="tender-btn active" id="tenderCash" onclick="setTender('CASH')">Cash</button>
            <button type="button" class="tender-btn" id="tenderCard" onclick="setTender('CARD')">Card / POS</button>
        </div>

        <div class="form-group" id="cashTenderGroup" style="margin-bottom: 8px;">
            <label>Cash Tendered (ZAR) <small style="color:var(--red-alert); font-weight: 600;">* Required</small></label>
            <input type="number" id="cashReceived" class="form-control" placeholder="0.00" step="0.01" oninput="calculateChange()" required>
        </div>

        <div class="form-group" id="changeDueGroup" style="margin-bottom: 12px;">
            <label>Change Due</label>
            <input type="text" id="changeDue" class="form-control" readonly value="R 0.00" style="color: var(--green-active); font-weight: 600;">
        </div>
    </div>

    <button type="button" class="btn-submit" onclick="checkoutBatchOrder()">Complete Checkout</button>
</div>

<script>
    let currentGrandTotal = 150.00; // Example total
    let posCart = [{ id: 1, name: "Sample Item", price: 150.00 }]; // Mock active cart
    let selectedTender = 'CASH';

    function setTender(method) {
        selectedTender = method;
        const cashBtn = document.getElementById('tenderCash');
        const cardBtn = document.getElementById('tenderCard');
        const cashGroup = document.getElementById('cashTenderGroup');
        const changeGroup = document.getElementById('changeDueGroup');

        if (method === 'CASH') {
            cashBtn.classList.add('active');
            cardBtn.classList.remove('active');
            cashGroup.style.display = 'flex';
            changeGroup.style.display = 'flex';
        } else {
            cardBtn.classList.add('active');
            cashBtn.classList.remove('active');
            cashGroup.style.display = 'none';
            changeGroup.style.display = 'none';
        }
    }

    function calculateChange() {
        const tenderedInput = document.getElementById('cashReceived').value.trim();
        if (tenderedInput === '') {
            document.getElementById('changeDue').value = 'R 0.00';
            return 0;
        }
        const tendered = parseFloat(tenderedInput) || 0;
        const change = tendered - currentGrandTotal;
        if (change < 0) {
            document.getElementById('changeDue').value = `Short by R ${Math.abs(change).toFixed(2)}`;
        } else {
            document.getElementById('changeDue').value = `R ${change.toFixed(2)}`;
        }
        return change;
    }

    function showNotification(msg, type) {
        const notif = document.getElementById('notification');
        notif.innerText = msg;
        notif.className = type;
        notif.style.display = 'block';
    }

    async function checkoutBatchOrder() {
        document.getElementById('notification').style.display = 'none';

        if (posCart.length === 0) {
            showNotification('Cart is empty. Scan items before completing sale.', 'error');
            return;
        }

        if (selectedTender === 'CASH') {
            const tenderedVal = document.getElementById('cashReceived').value.trim();
            if (!tenderedVal) {
                showNotification('Please enter the cash tendered amount to complete the sale.', 'error');
                document.getElementById('cashReceived').focus();
                return;
            }
            const tenderedAmt = parseFloat(tenderedVal) || 0;
            if (tenderedAmt < currentGrandTotal) {
                const shortAmt = (currentGrandTotal - tenderedAmt).toFixed(2);
                showNotification(`Insufficient cash tendered. Total is R ${currentGrandTotal.toFixed(2)} but R ${tenderedAmt.toFixed(2)} was entered (Short by R ${shortAmt}).`, 'error');
                document.getElementById('cashReceived').focus();
                return;
            }
        }

        let orderRef = document.getElementById('posOrderRef').value.trim();
        if (!orderRef) {
            orderRef = `POS-${Math.floor(1000 + Math.random() * 9000)}`;
        }

        showNotification(`Order ${orderRef} processed successfully! Change: ${document.getElementById('changeDue').value}`, 'success');
    }
</script>

</body>
</html>
