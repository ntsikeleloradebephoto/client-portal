<script>
        const SUPABASE_URL = 'https://aivsmcdhxfdccsbqmejt.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_NDE9uLsqMD2QiIa6LMw-Lw_IBOmeebV';
        let supabaseClient;

        // Initialize Supabase safely
        try {
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        } catch (e) {
            console.error("Failed to initialize Supabase:", e);
        }

        const appToast = document.getElementById('appToast');
        const toastMessage = document.getElementById('toastMessage');

        function showNotification(message, type = 'success') {
            if (!toastMessage || !appToast) return;
            toastMessage.innerText = message;
            appToast.className = `show ${type}`;
            setTimeout(() => {
                appToast.className = '';
            }, 3200);
        }

        function switchTab(tabNum) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            
            const targetTab = document.getElementById(`tab-${tabNum}`);
            if (targetTab) targetTab.classList.add('active');
            
            if (window.event && window.event.currentTarget) {
                window.event.currentTarget.classList.add('active');
            }

            if (tabNum === 4) {
                loadEditableInventory();
            }
        }

        async function loadEditableInventory() {
            const tableBody = document.getElementById('editableInventoryTable');
            if (!tableBody) return;
            
            tableBody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: var(--text-muted); padding: 25px 0;">Loading inventory...</td></tr>`;

            if (!supabaseClient) {
                tableBody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: var(--danger); padding: 25px 0;">Supabase client not initialized.</td></tr>`;
                return;
            }

            const { data, error } = await supabaseClient.from('inventory').select('*').order('id', { ascending: true });

            if (error) {
                console.error("Error fetching inventory:", error);
                tableBody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: var(--danger); padding: 25px 0;">Failed to load inventory: ${error.message}</td></tr>`;
                return;
            }

            if (!data || data.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: var(--text-muted); padding: 25px 0;">No inventory records found.</td></tr>`;
                return;
            }

            let html = '';
            data.forEach(item => {
                const id = item.id;
                const sku = item.sku || item.item_number || item.barcode || '';
                const desc = item.item_description || item.product_name || item.name || '';
                const stockQty = item.stock_qty ?? item.stock ?? item.quantity ?? 0;
                const floorPrice = item.wholesale_floor || item.floor_price || 0;
                const sellingPrice = item.selling_price || item.unit_price || 0;
                const supplier = item.supplier_partner || item.consignor || item.supplier || 'Standard';

                html += `
                    <tr id="row-${id}">
                        <td><small style="color:var(--text-muted);">${sku}</small></td>
                        <td><input type="text" class="table-input" id="desc-${id}" value="${desc}"></td>
                        <td><input type="number" class="table-input" id="qty-${id}" value="${stockQty}" style="width: 80px;"></td>
                        <td><input type="number" step="0.01" class="table-input" id="floor-${id}" value="${parseFloat(floorPrice).toFixed(2)}" style="width: 100px;"></td>
                        <td><input type="number" step="0.01" class="table-input" id="selling-${id}" value="${parseFloat(sellingPrice).toFixed(2)}" style="width: 100px;"></td>
                        <td><input type="text" class="table-input" id="supplier-${id}" value="${supplier}"></td>
                        <td><button class="btn-action" type="button" onclick="window.saveInventoryRow(${id})">Save</button></td>
                    </tr>
                `;
            });

            tableBody.innerHTML = html;
        }

        window.saveInventoryRow = async function(id) {
            console.log("Save clicked for item ID:", id);

            const descInput = document.getElementById(`desc-${id}`);
            const qtyInput = document.getElementById(`qty-${id}`);
            const floorInput = document.getElementById(`floor-${id}`);
            const sellingInput = document.getElementById(`selling-${id}`);
            const supplierInput = document.getElementById(`supplier-${id}`);

            if (!descInput) {
                showNotification("Error: Form inputs missing.", "error");
                return;
            }

            const updatePayload = {
                item_description: descInput.value.trim(),
                stock_qty: parseInt(qtyInput.value) || 0,
                wholesale_floor: parseFloat(floorInput.value) || 0,
                selling_price: parseFloat(sellingInput.value) || 0,
                supplier_partner: supplierInput.value.trim()
            };

            const { data, error } = await supabaseClient
                .from('inventory')
                .update(updatePayload)
                .eq('id', id)
                .select();

            if (error) {
                console.error("Supabase Update Error:", error);
                showNotification("Update failed: " + error.message, "error");
            } else {
                console.log("Update successful:", data);
                showNotification("Item successfully updated!", "success");
            }
        }

        // Run on load
        loadEditableInventory();
    </script>
