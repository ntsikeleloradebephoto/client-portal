<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nguni Homeware | Control & POS Hub</title>
    <link rel="icon" type="image/png" href="logo.png">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <style>
        :root {
            --bg-dark: #0b0c0e;
            --panel-dark: #121417;
            --gold-primary: #d4af37;
            --gold-light: #f3c649;
            --text-light: #f5f5f5;
            --text-muted: #a0a5ad;
            --border-gold: #3a3219;
            --green-active: #2e7d32;
            --green-light: #81c784;
            --red-alert: #d32f2f;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            margin: 0;
            padding: 24px;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 2px solid var(--border-gold);
            padding-bottom: 16px;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 18px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--gold-primary);
            margin: 0;
        }

        /* TABS NAVIGATION */
        .tabs {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }

        .tab-btn {
            background: var(--panel-dark);
            border: 1px solid var(--border-gold);
            color: var(--text-muted);
            padding: 14px;
            font-weight: 700;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background: var(--gold-primary);
            color: #000;
            border-color: var(--gold-light);
        }

        .tab-content {
            display: none;
            background: var(--panel-dark);
            border: 1px solid var(--border-gold);
            padding: 24px;
            border-radius: 6px;
        }

        .tab-content.active {
            display: block;
        }

        .section-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--gold-primary);
            margin-top: 0;
            margin-bottom: 20px;
        }

        /* METRICS SUMMARY */
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }

        .summary-card {
            background: #08090a;
            border: 1px solid #1f2228;
            padding: 16px;
            border-radius: 4px;
        }

        .summary-label {
            font-size: 9px;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 1px;
        }

        .summary-val {
            font-size: 24px;
            font-weight: 700;
            margin-top: 6px;
        }

        /* TABLE STYLING */
        .ledger-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        .ledger-table th {
            text-align: left;
            padding: 12px;
            font-size: 10px;
            text-transform: uppercase;
            color: var(--gold-primary);
            letter-spacing: 1px;
            border-bottom: 1px solid var(--border-gold);
        }

        .ledger-table td {
            padding: 14px 12px;
            border-bottom: 1px solid #1f2228;
            vertical-align: middle;
        }

        .item-name {
            font-weight: 700;
            text-transform: capitalize;
        }

        .item-code {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .status-badge {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .status-pending { color: var(--gold-light); }
        .status-settled { color: var(--green-light); }

        .btn-action {
            padding: 6px 10px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            margin-right: 4px;
        }

        .btn-pending { background: #d4af37; color: #000; }
        .btn-settled { background: #2e7d32; color: #fff; }
        .btn-delete { background: #d32f2f; color: #fff; }

        /* FORM INPUT STYLING FOR TAB 1 & 2 */
        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 10px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .form-control {
            width: 100%;
            padding: 10px;
            background: #08090a;
            border: 1px solid #1f2228;
            color: #fff;
            border-radius: 4px;
            box-sizing: border-box;
        }

        .btn-submit {
            background: var(--gold-primary);
            color: #000;
            font-weight: 700;
            padding: 12px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="header">
        <img src="logo.png" alt="Nguni Logo" style="height: 36px;" onerror="this.style.display='none'">
        <h1>NGUNI HOMEWARE | CONTROL & POS HUB</h1>
    </div>

    <!-- TABS -->
    <div class="tabs">
        <button class="tab-btn" onclick="switchTab('tab1')">1. POS SCAN OUT</button>
        <button class="tab-btn" onclick="switchTab('tab2')">2. STOCK IN INTAKE</button>
        <button class="tab-btn active" onclick="switchTab('tab3')">3. SETTLEMENT & ORDER MANAGER</button>
    </div>

    <!-- TAB 1: POS SCAN OUT -->
    <div id="tab1" class="tab-content">
        <div class="section-title">POS Dispatch / Scan Out</div>
        <form id="posForm" onsubmit="handlePosSubmit(event)">
            <div class="form-group">
                <label>Item Name</label>
                <input type="text" id="posItemName" class="form-control" required placeholder="e.g. Cast Iron Pot 3L">
            </div>
            <div class="form-group">
                <label>Order Ref / SKU</label>
                <input type="text" id="posOrderRef" class="form-control" required placeholder="e.g. #1043">
            </div>
            <div class="form-group">
                <label>Quantity Dispatched</label>
                <input type="number" id="posQty" class="form-control" value="1" min="1" required>
            </div>
            <div class="form-group">
                <label>Wholesale Floor Amount (ZAR)</label>
                <input type="number" id="posWholesale" class="form-control" required placeholder="520">
            </div>
            <button type="submit" class="btn-submit">Dispatch Order</button>
        </form>
    </div>

    <!-- TAB 2: STOCK IN INTAKE -->
    <div id="tab2" class="tab-content">
        <div class="section-title">Consignment Stock Intake</div>
        <form id="stockForm" onsubmit="handleStockSubmit(event)">
            <div class="form-group">
                <label>SKU Description</label>
                <input type="text" id="stockName" class="form-control" required placeholder="e.g. Ceramic Teaset">
            </div>
            <div class="form-group">
                <label>Quantity Intake</label>
                <input type="number" id="stockQty" class="form-control" value="10" required>
            </div>
            <button type="submit" class="btn-submit">Add Inventory Line</button>
        </form>
    </div>

    <!-- TAB 3: SETTLEMENT & ORDER MANAGER -->
    <div id="tab3" class="tab-content active">
        <div class="section-title">Settlement Ledger & Order Actions</div>

        <div class="summary-grid">
            <div class="summary-card">
                <div class="summary-label">Locked Wholesale Payout Owed (Escrow Pending)</div>
                <div class="summary-val" id="adminOwed" style="color: var(--gold-light);">R 0.00</div>
            </div>
            <div class="summary-card">
                <div class="summary-label">Total Settled & Paid Out</div>
                <div class="summary-val" id="adminSettled" style="color: var(--green-light);">R 0.00</div>
            </div>
        </div>

        <table class="ledger-table">
            <thead>
                <tr>
                    <th>Order Ref / Item</th>
                    <th>Date</th>
                    <th>Qty / Dispatched</th>
                    <th>Wholesale Amount</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="adminOrderTable">
                <tr><td colspan="6" style="color: var(--text-muted);">Loading ledger orders...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        const SUPABASE_URL = 'https://aivsmcdhxfdccsbqmejt.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_NDE9uLsqMD2QiIa6LMw-Lw_IBOmeebV';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        async function fetchAdminOrders() {
            const { data: orders, error } = await supabaseClient
                .from('orders')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                console.error("Error loading orders:", error);
                return;
            }

            renderAdminOrders(orders || []);
        }

        function renderAdminOrders(orders) {
            let pendingSum = 0;
            let settledSum = 0;

            const tbody = document.getElementById('adminOrderTable');
            tbody.innerHTML = '';

            if (orders.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="color: var(--text-muted);">No orders in database.</td></tr>';
                document.getElementById('adminOwed').innerText = 'R 0.00';
                document.getElementById('adminSettled').innerText = 'R 0.00';
                return;
            }

            orders.forEach(order => {
                const wholesaleVal = parseFloat(order.wholesale_floor_zar) || 0;
                const qty = parseInt(order.quantity_dispatched) || 1;
                const isSettled = order.payout_status === 'SETTLED';

                if (isSettled) {
                    settledSum += wholesaleVal;
                } else {
                    pendingSum += wholesaleVal;
                }

                let dateStr = 'N/A';
                if (order.created_at) {
                    const parsedDate = new Date(order.created_at);
                    if (!isNaN(parsedDate.getTime())) {
                        dateStr = parsedDate.toLocaleDateString('en-US');
                    }
                }

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>
                        <div class="item-name">${order.item_name || 'Consignment Item'}</div>
                        <div class="item-code">${order.order_number || 'N/A'}</div>
                    </td>
                    <td>${dateStr}</td>
                    <td style="font-weight: 700;">${qty} ${qty > 1 ? 'Units' : 'Unit'}</td>
                    <td style="font-weight: 700;">R ${wholesaleVal.toFixed(2)}</td>
                    <td>
                        <span class="status-badge ${isSettled ? 'status-settled' : 'status-pending'}">
                            ${order.payout_status || 'ESCROW PENDING'}
                        </span>
                    </td>
                    <td>
                        ${isSettled 
                            ? `<button class="btn-action btn-pending" onclick="updateStatus('${order.id}', 'ESCROW PENDING')">Mark Pending</button>`
                            : `<button class="btn-action btn-settled" onclick="updateStatus('${order.id}', 'SETTLED')">Mark Settled</button>`
                        }
                        <button class="btn-action btn-delete" onclick="deleteOrder('${order.id}')">Delete</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('adminOwed').innerText = `R ${pendingSum.toFixed(2)}`;
            document.getElementById('adminSettled').innerText = `R ${settledSum.toFixed(2)}`;
        }

        async function updateStatus(orderId, newStatus) {
            const { error } = await supabaseClient
                .from('orders')
                .update({ payout_status: newStatus })
                .eq('id', orderId);

            if (error) {
                alert('Error updating status: ' + error.message);
            } else {
                fetchAdminOrders();
            }
        }

        async function deleteOrder(orderId) {
            if (!confirm('Are you sure you want to delete this order?')) return;

            const { error } = await supabaseClient
                .from('orders')
                .delete()
                .eq('id', orderId);

            if (error) {
                alert('Error deleting order: ' + error.message);
            } else {
                fetchAdminOrders();
            }
        }

        async function handlePosSubmit(e) {
            e.preventDefault();
            const itemName = document.getElementById('posItemName').value;
            const orderRef = document.getElementById('posOrderRef').value;
            const qty = parseInt(document.getElementById('posQty').value);
            const wholesale = parseFloat(document.getElementById('posWholesale').value);

            const { error } = await supabaseClient.from('orders').insert([
                {
                    item_name: itemName,
                    order_number: orderRef,
                    quantity_dispatched: qty,
                    wholesale_floor_zar: wholesale,
                    payout_status: 'ESCROW PENDING'
                }
            ]);

            if (error) {
                alert('Error creating order: ' + error.message);
            } else {
                document.getElementById('posForm').reset();
                switchTab('tab3');
                fetchAdminOrders();
            }
        }

        async function handleStockSubmit(e) {
            e.preventDefault();
            const stockName = document.getElementById('stockName').value;
            const qty = parseInt(document.getElementById('stockQty').value);

            const { error } = await supabaseClient.from('inventory').insert([
                { item_description: stockName, quantity_allocated: qty }
            ]);

            if (error) {
                alert('Error adding inventory: ' + error.message);
            } else {
                alert('Inventory line added successfully!');
                document.getElementById('stockForm').reset();
            }
        }

        // Realtime Listener & Initial Load
        fetchAdminOrders();
        supabaseClient.channel('admin_realtime').on('postgres_changes', { event: '*', schema: 'public' }, () => {
            fetchAdminOrders();
        }).subscribe();
    </script>
</body>
</html>
