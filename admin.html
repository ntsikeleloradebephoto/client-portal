<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nguni Homeware - Dispatch Order Logger</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <style>
        :root {
            --bg-dark: #0b0c0e;
            --panel-dark: #121417;
            --gold-primary: #d4af37;
            --gold-light: #f3c649;
            --text-light: #f5f5f5;
            --text-muted: #a0a5ad;
            --border-gold: #3a3219;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            margin: 0;
            padding: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
        }

        .admin-card {
            background: var(--panel-dark);
            border: 1px solid var(--border-gold);
            border-top: 4px solid var(--gold-primary);
            padding: 32px;
            border-radius: 8px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6);
        }

        h1 {
            font-size: 16px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--gold-primary);
            margin-top: 0;
            margin-bottom: 20px;
            border-bottom: 1px solid #1f2228;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            background: #08090a;
            border: 1px solid #2a2e37;
            border-radius: 4px;
            color: #fff;
            font-size: 14px;
            box-sizing: border-box;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--gold-primary);
        }

        button {
            width: 100%;
            padding: 14px;
            background: var(--gold-primary);
            color: #000;
            border: none;
            border-radius: 4px;
            font-weight: 700;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }

        button:hover {
            background: var(--gold-light);
        }

        #statusMsg {
            margin-top: 16px;
            font-size: 13px;
            text-align: center;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="admin-card">
        <h1>NGUNI HOT DESK <span>| LOG ORDER</span></h1>
        
        <form id="orderForm">
            <div class="form-group">
                <label>Item Name</label>
                <input type="text" id="itemName" placeholder="e.g. Cast Iron Pot 3L" required>
            </div>

            <div class="form-group">
                <label>Order Reference Number</label>
                <input type="text" id="orderNum" placeholder="e.g. #1043" required>
            </div>

            <div class="form-group">
                <label>Wholesale Floor Price (ZAR)</label>
                <input type="number" step="0.01" id="wholesalePrice" placeholder="e.g. 520" required>
            </div>

            <div class="form-group">
                <label>Payout Status</label>
                <select id="payoutStatus">
                    <option value="ESCROW PENDING">ESCROW PENDING</option>
                    <option value="SETTLED">SETTLED</option>
                </select>
            </div>

            <button type="submit" id="submitBtn">Log Order to Ledger</button>
        </form>

        <div id="statusMsg"></div>
    </div>

    <script>
        const SUPABASE_URL = 'https://aivsmcdhxfdccsbqmejt.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_NDE9uLsqMD2QiIa6LMw-Lw_IBOmeebV';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const orderForm = document.getElementById('orderForm');
        const statusMsg = document.getElementById('statusMsg');
        const submitBtn = document.getElementById('submitBtn');

        orderForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            submitBtn.disabled = true;
            submitBtn.innerText = 'Logging...';
            statusMsg.innerText = '';

            const item_name = document.getElementById('itemName').value;
            const order_number = document.getElementById('orderNum').value;
            const wholesale_floor_zar = parseFloat(document.getElementById('wholesalePrice').value);
            const payout_status = document.getElementById('payoutStatus').value;

            const { data, error } = await supabaseClient
                .from('orders')
                .insert([
                    { 
                        item_name: item_name, 
                        order_number: order_number, 
                        wholesale_floor_zar: wholesale_floor_zar, 
                        payout_status: payout_status 
                    }
                ]);

            if (error) {
                statusMsg.style.color = '#ff5555';
                statusMsg.innerText = '❌ Error: ' + error.message;
            } else {
                statusMsg.style.color = '#55ff55';
                statusMsg.innerText = '✅ Order successfully logged to trade ledger!';
                orderForm.reset();
            }

            submitBtn.disabled = false;
            submitBtn.innerText = 'Log Order to Ledger';
        });
    </script>
</body>
</html>
