<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nguni Homeware | Control & Enterprise POS Hub</title>
    <link rel="icon" type="image/png" href="logo.png">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <style>
        :root {
            --bg-dark: #0b0c0e;
            --panel-dark: #121417;
            --gold-primary: #d4af37;
            --gold-light: #f3c649;
            --text-light: #f5f5f5;
            --text-muted: #a0a5ad;
            --border-gold: #3a3219;
            --green-active: #2e7d32;
            --green-light: #81c784;
            --red-alert: #d32f2f;
            --red-light: #ef5350;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            margin: 0;
            padding: 24px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-gold);
            padding-bottom: 16px;
            margin-bottom: 24px;
        }

        .header-title { display: flex; align-items: center; gap: 12px; }
        .header h1 { font-size: 18px; letter-spacing: 2px; text-transform: uppercase; color: var(--gold-primary); margin: 0; }
        .role-badge { background: #08090a; border: 1px solid var(--border-gold); color: var(--gold-light); padding: 6px 12px; border-radius: 4px; font-size: 11px; font-weight: bold; display: flex; align-items: center; gap: 10px; }

        .tabs { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; margin-bottom: 24px; }
        .tab-btn { background: var(--panel-dark); border: 1px solid var(--border-gold); color: var(--text-muted); padding: 12px; font-weight: 700; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; border-radius: 4px; transition: all 0.2s ease; }
        .tab-btn.active { background: var(--gold-primary); color: #000; border-color: var(--gold-light); }

        .tab-content { display: none; background: var(--panel-dark); border: 1px solid var(--border-gold); padding: 24px; border-radius: 6px; }
        .tab-content.active { display: block; }

        .section-title { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--gold-primary); margin-top: 0; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }

        .summary-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
        .summary-card { background: #08090a; border: 1px solid #1f2228; padding: 16px; border-radius: 4px; }
        .summary-label { font-size: 9px; text-transform: uppercase; color: var(--text-muted); letter-spacing: 1px; }
        .summary-val { font-size: 20px; font-weight: 700; margin-top: 6px; }

        .ledger-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .ledger-table th { text-align: left; padding: 12px; font-size: 10px; text-transform: uppercase; color: var(--gold-primary); letter-spacing: 1px; border-bottom: 1px solid var(--border-gold); }
        .ledger-table td { padding: 14px 12px; border-bottom: 1px solid #1f2228; vertical-align: middle; }

        .status-badge { font-size: 10px; font-weight: 700; text-transform: uppercase; padding: 2px 6px; border-radius: 3px; }
        .status-pending { color: var(--gold-light); background: rgba(212, 175, 55, 0.1); }
        .status-settled { color: var(--green-light); background: rgba(46, 125, 50, 0.2); }
