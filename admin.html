<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nguni Homeware | Enterprise POS & Ledger Hub</title>
    <link rel="icon" type="image/png" href="logo.png">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --bg-dark: #000000;
            --bg-surface: rgba(28, 28, 30, 0.65);
            --panel-glass: rgba(22, 22, 24, 0.72);
            --gold-primary: #D4AF37;
            --gold-light: #F3E5AB;
            --gold-dark: #997A15;
            --gold-gradient: linear-gradient(135deg, #F3E5AB 0%, #D4AF37 50%, #AA7C11 100%);
            --gold-glow: 0 8px 32px rgba(212, 175, 55, 0.25);
            --text-light: #F5F5F7;
            --text-muted: rgba(245, 245, 247, 0.55);
            --border-glass: rgba(212, 175, 55, 0.25);
            --border-subtle: rgba(255, 255, 255, 0.08);
            --green-active: #30D158;
            --red-alert: #FF453A;
            --cyan-bright: #64D2FF;
            --glass-blur: blur(40px) saturate(190%);
            --glass-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.12);

            --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro", "Helvetica Neue", sans-serif;
            --font-text: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro", "Helvetica Neue", sans-serif;
            --font-mono: "SF Mono", SFMono-Regular, ui-monospace, Menlo, Monaco, monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-text); -webkit-font-smoothing: antialiased; }
        body { background: #000; background-image: radial-gradient(circle at 50% -20%, #2A210B 0%, #000 80%); background-attachment: fixed; color: var(--text-light); padding: 24px; min-height: 100vh; }

        body.skin-space { background: #0a0e1a !important; background-image: radial-gradient(circle at 50% -20%, #1a2642 0%, #050811 80%) !important; color: #f5f5f7 !important; }
        body.skin-frost { background: #f2f2f7 !important; background-image: radial-gradient(circle at 50% -20%, #fff 0%, #e5e5ea 80%) !important; color: #1c1c1e !important; }
        body.skin-emerald { background: #030a05 !important; background-image: radial-gradient(circle at 50% -20%, #0f2e1a 0%, #030a05 80%) !important; }
        body.skin-ruby { background: #0d0505 !important; background-image: radial-gradient(circle at 50% -20%, #331414 0%, #0d0505 80%) !important; }

        #appleTvLauncher { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: radial-gradient(circle at center, #231C0C 0%, #000 100%); z-index: 99999; display: flex; flex-direction: column; justify-content: center; align-items: center; backdrop-filter: blur(50px); transition: opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1), transform 1.2s cubic-bezier(0.16, 1, 0.3, 1); }
        #appleTvLauncher.fade-out { opacity: 0; transform: scale(1.08); pointer-events: none; }
        .launcher-content { display: flex; flex-direction: column; align-items: center; text-align: center; }
        .launcher-logo-center { width: 220px; height: 220px; object-fit: contain; margin-bottom: 28px; border-radius: 36px; padding: 12px; background: rgba(255,255,255,0.03); border: 1px solid rgba(212,175,55,0.35); box-shadow: 0 30px 80px rgba(0,0,0,0.9); }
        .launcher-title { font-family: var(--font-display); font-size: 32px; font-weight: 700; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 6px; }
        .launcher-subtitle { font-size: 13px; color: var(--text-muted); letter-spacing: 0.18em; text-transform: uppercase; }

        #toastContainer { position: fixed; bottom: 24px; right: 24px; z-index: 10000; display: flex; flex-direction: column; gap: 10px; max-width: 380px; pointer-events: none; }
        .toast-notification { pointer-events: auto; background: rgba(25,25,32,0.9); backdrop-filter: blur(20px); border: 1px solid var(--border-subtle); padding: 14px 18px; border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: flex; align-items: flex-start; gap: 12px; font-size: 12px; color: #fff; }
        .toast-notification.success { border-left: 4px solid var(--green-active); }
        .toast-notification.error { border-left: 4px solid var(--red-alert); }
        .toast-notification.info { border-left: 4px solid var(--cyan-bright); }

        .header { display: flex; justify-content: space-between; align-items: center; padding: 16px 24px; margin-bottom: 20px; background: var(--panel-glass); backdrop-filter: var(--glass-blur); border: 1px solid var(--border-subtle); border-radius: 18px; box-shadow: var(--glass-shadow); }
        .header-title { display: flex; align-items: center; gap: 14px; }
        .header h1 { font-family: var(--font-display); font-size: 15px; font-weight: 600; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header-controls { display: flex; align-items: center; gap: 12px; }
        .role-badge { background: rgba(255,255,255,0.04); border: 1px solid var(--border-glass); color: var(--gold-light); padding: 6px 14px; border-radius: 980px; font-size: 11px; font-weight: 500; display: flex; align-items: center; gap: 12px; }

        .tabs { display: grid; grid-template-columns: repeat(13, 1fr); gap: 4px; margin-bottom: 20px; background: rgba(255,255,255,0.02); padding: 6px; border-radius: 16px; border: 1px solid var(--border-subtle); backdrop-filter: var(--glass-blur); }
        .tab-btn { background: transparent; border: 1px solid transparent; color: var(--text-muted); padding: 10px 2px; font-weight: 500; font-size: 8px; cursor: pointer; border-radius: 10px; transition: all 0.25s ease; text-align: center; }
        .tab-btn:hover { color: var(--text-light); background: rgba(255,255,255,0.06); }
        .tab-btn.active { background: var(--gold-gradient); color: #000; font-weight: 600; box-shadow: var(--gold-glow); border: 1px solid rgba(255,255,255,0.4); }

        .tab-content { display: none; background: var(--panel-glass); border: 1px solid var(--border-subtle); padding: 24px; border-radius: 22px; backdrop-filter: var(--glass-blur); box-shadow: var(--glass-shadow); }
        .tab-content.active { display: block; }

        .section-title { font-family: var(--font-display); font-size: 13px; font-weight: 600; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 18px; display: flex; justify-content: space-between; align-items: center; }

        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 11px; font-weight: 500; color: var(--text-muted); margin-bottom: 6px; }
        .form-control { width: 100%; padding: 10px 14px; background: rgba(0,0,0,0.5); border: 1px solid var(--border-subtle); color: inherit; border-radius: 10px; font-size: 13px; }
        .form-control:focus { outline: none; border-color: var(--gold-primary); box-shadow: 0 0 0 3px rgba(212,175,55,0.2); background: rgba(0,0,0,0.7); }

        .trade-header-bar { display: flex; justify-content: space-between; align-items: center; background: rgba(15,15,18,0.7); border: 1px solid var(--border-subtle); padding: 16px 20px; border-radius: 16px; margin-bottom: 18px; }
