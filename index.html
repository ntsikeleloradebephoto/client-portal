<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nguni Homeware | Supplier Trade Ledger</title>
    <link rel="icon" type="image/png" href="logo.png">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-dark: #0b0c0e;
            --panel-dark: #121417;
            --gold-primary: #d4af37;
            --gold-light: #f3c649;
            --text-light: #f5f5f5;
            --text-muted: #a0a5ad;
            --border-gold: #3a3219;
            --green-active: #2e7d32;
            --green-light: #81c784;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            margin: 0;
            padding: 24px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-gold);
            padding-bottom: 16px;
            margin-bottom: 24px;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header h1 {
            font-size: 18px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--gold-primary);
            margin: 0;
        }

        .sync-badge {
            background: rgba(46, 125, 50, 0.2);
            border: 1px solid var(--green-active);
            color: var(--green-light);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .dot {
            width: 8px;
            height: 8px;
            background-color: var(--green-light);
            border-radius: 50%;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }

        @media (max-width: 900px) {
            .metrics-grid { grid-template-columns: repeat(2, 1fr); }
        }

        .card {
            background: var(--panel-dark);
            border: 1px solid var(--border-gold);
            padding: 20px;
            border-radius: 6px;
        }

        .card-label {
            font-size: 10px;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 1px;
        }

        .card-val {
            font-size: 28px;
            font-weight: 700;
            margin-top: 8px;
            color: var(--text-light);
        }

        .main-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 24px;
        }

        @media (max-width: 1000px) {
            .main-grid { grid-template-columns: 1fr; }
        }

        .panel {
            background: var(--panel-dark);
            border: 1px solid var(--border-gold);
            padding: 20px;
            border-radius: 6px;
        }

        .panel-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--gold-primary);
            margin-top: 0;
            margin-bottom: 16px;
        }

        .manifest-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .manifest-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: #08090a;
            border: 1px solid #1f2228;
            border-radius: 4px;
        }

        .item-title {
            font-weight: 700;
            font-size: 14px;
            text-transform: capitalize;
        }

        .item-sub {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .item-price {
            font-weight: 700;
            color: var(--gold-light);
            text-align: right;
        }

        .badge-status {
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
            margin-top: 2px;
            text-align: right;
        }

        .status-escrow { color: var(--gold-light); }
        .status-settled { color: var(--green-light); }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-title">
            <img src="logo.png" alt="Nguni Logo" style="height: 36px;" onerror="this.style.display='none'">
            <h1>NGUNI HOMEWARE | SUPPLIER TRADE LEDGER</h1>
        </div>
        <div class="sync-badge">
            <span class="dot"></span> Realtime Sync Active
        </div>
    </div>

    <!-- METRICS CARDS -->
    <div class="metrics-grid">
        <div class="card">
            <div class="card-label">Total Units Consigned & Sold</div>
            <div class="card-val" id="cardUnits">0 Units</div>
        </div>
        <div class="card">
            <div class="card-label">Locked Wholesale Payout Owed</div>
            <div class="card-val" id="cardOwed" style="color: var(--gold-light);">R 0</div>
        </div>
        <div class="card">
            <div class="card-label">Active Pilot SKUs</div>
            <div class="card-val" id="cardSkus">0 Lines</div>
        </div>
        <div class="card">
            <div class="card-label">Settlement Cycle</div>
            <div class="card-val">15–30 Days</div>
        </div>
    </div>

    <!-- MAIN DASHBOARD CONTENT -->
    <div class="main-grid">
        
        <!-- LEFT: VELOCITY CHART -->
        <div class="panel">
            <div class="panel-title">Weekly Unit Sales Velocity</div>
            <div style="height: 320px;">
                <canvas id="velocityChart"></canvas>
            </div>
        </div>

        <!-- RIGHT: CONSIGNMENT SALES MANIFEST -->
        <div class="panel">
            <div class="panel-title">Consignment Sales Manifest</div>
            <div class="manifest-list" id="manifestList">
                <div style="color: var(--text-muted); font-size: 12px;">Loading sales manifest...</div>
            </div>
        </div>

    </div>

    <script>
        const SUPABASE_URL = 'https://aivsmcdhxfdccsbqmejt.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_NDE9uLsqMD2QiIa6LMw-Lw_IBOmeebV';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let velocityChart = null;

        async function fetchLedgerData() {
            // Fetch Inventory count
            const { data: invData } = await supabaseClient.from('inventory').select('id');
            const skuCount = invData ? invData.length : 0;
            document.getElementById('cardSkus').innerText = `${skuCount} Lines`;

            // Fetch Orders
            const { data: ordersData, error } = await supabaseClient.from('orders').select('*').order('created_at', { ascending: false });

            if (!error && ordersData) {
                renderDashboard(ordersData);
            }
        }

        function renderDashboard(orders) {
            // 1. Total Units Sold
            let totalUnits = 0;
            orders.forEach(o => totalUnits += (o.quantity_dispatched || 1));
            document.getElementById('cardUnits').innerText = `${totalUnits} Units`;

            // 2. Locked Wholesale Payout Owed (FILTERED ONLY FOR 'ESCROW PENDING')
            const totalOwed = orders
                .filter(order => order.payout_status === 'ESCROW PENDING')
                .reduce((sum, order) => sum + parseFloat(order.wholesale_floor_zar || 0), 0);

            document.getElementById('cardOwed').innerText = `R ${Math.round(totalOwed).toLocaleString()}`;

            // 3. Render Manifest List
            const manifestList = document.getElementById('manifestList');
            manifestList.innerHTML = '';

            orders.forEach(order => {
                const isSettled = order.payout_status === 'SETTLED';
                const dateStr = order.created_at ? new Date(order.created_at).toLocaleDateString('en-GB', { day: '2-digit', month: 'Short', year: 'numeric' }) : '';

                const itemDiv = document.createElement('div');
                itemDiv.className = 'manifest-item';
                itemDiv.innerHTML = `
                    <div>
                        <div class="item-title">${order.item_name}</div>
                        <div class="item-sub">Order Ref: ${order.order_number} • ${dateStr}</div>
                    </div>
                    <div>
                        <div class="item-price">R ${Math.round(order.wholesale_floor_zar)}</div>
                        <div class="badge-status ${isSettled ? 'status-settled' : 'status-escrow'}">
                            ${order.payout_status}
                        </div>
                    </div>
                `;
                manifestList.appendChild(itemDiv);
            });

            // 4. Render Velocity Chart
            renderChart(orders);
        }

        function renderChart(orders) {
            const dateMap = {};
            
            // Group sales by date
            orders.slice().reverse().forEach(o => {
                const dateKey = o.created_at ? new Date(o.created_at).toLocaleDateString('en-GB', { day: '2-digit', month: 'Short', year: 'numeric' }) : 'Recent';
                dateMap[dateKey] = (dateMap[dateKey] || 0) + (o.quantity_dispatched || 1);
            });

            const labels = Object.keys(dateMap);
            const dataPoints = Object.values(dateMap);

            const ctx = document.getElementById('velocityChart').getContext('2d');

            if (velocityChart) {
                velocityChart.destroy();
            }

            velocityChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels.length ? labels : ['No Data'],
                    datasets: [{
                        label: 'Units Dispatched',
                        data: dataPoints.length ? dataPoints : [0],
                        borderColor: '#d4af37',
                        backgroundColor: 'rgba(212, 175, 55, 0.1)',
                        fill: true,
                        tension: 0.2,
                        pointBackgroundColor: '#d4af37',
                        pointRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { grid: { color: '#1f2228' }, ticks: { color: '#a0a5ad', font: { size: 10 } } },
                        y: { grid: { color: '#1f2228' }, ticks: { color: '#a0a5ad', font: { size: 10 } }, beginAtZero: true }
                    }
                }
            });
        }

        // Initialize & Listen for Realtime Updates
        fetchLedgerData();
        supabaseClient.channel('public_realtime').on('postgres_changes', { event: '*', schema: 'public' }, () => {
            fetchLedgerData();
        }).subscribe();
    </script>
</body>
</html>
