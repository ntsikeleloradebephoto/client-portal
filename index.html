<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nguni Homeware - Supplier Trade Ledger</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-dark: #0b0c0e;
            --panel-dark: #121417;
            --gold-primary: #d4af37;
            --gold-light: #f3c649;
            --text-light: #f5f5f5;
            --text-muted: #a0a5ad;
            --border-gold: #3a3219;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            margin: 0;
            padding: 24px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-gold);
            padding-bottom: 16px;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 20px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--gold-primary);
            margin: 0;
        }

        .status-badge {
            background: #122415;
            color: #4CAF50;
            border: 1px solid #2e7d32;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .metric-card {
            background: var(--panel-dark);
            border: 1px solid var(--border-gold);
            border-top: 3px solid var(--gold-primary);
            padding: 20px;
            border-radius: 6px;
        }

        .metric-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .metric-value {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-light);
        }

        .dashboard-layout {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 24px;
        }

        @media (max-width: 900px) {
            .dashboard-layout { grid-template-columns: 1fr; }
        }

        .panel {
            background: var(--panel-dark);
            border: 1px solid var(--border-gold);
            border-radius: 6px;
            padding: 20px;
        }

        .panel-title {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--gold-primary);
            margin-top: 0;
            margin-bottom: 16px;
            border-bottom: 1px solid #1f2228;
            padding-bottom: 8px;
        }

        .manifest-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .manifest-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #1f2228;
        }

        .manifest-item:last-child {
            border-bottom: none;
        }

        .item-details h4 {
            margin: 0 0 4px 0;
            font-size: 14px;
            color: var(--text-light);
        }

        .item-details p {
            margin: 0;
            font-size: 11px;
            color: var(--text-muted);
        }

        .item-payout {
            text-align: right;
        }

        .payout-amount {
            font-size: 14px;
            font-weight: 700;
            color: var(--gold-light);
        }

        .payout-status {
            font-size: 10px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 3px;
            display: inline-block;
            margin-top: 4px;
        }

        .status-pending { background: #3a2e10; color: #ffca28; }
        .status-settled { background: #122415; color: #81c784; }

        .chart-container {
            position: relative;
            height: 260px;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>NGUNI HOMEWARE <span>| SUPPLIER TRADE LEDGER</span></h1>
        <div class="status-badge">🟢 Realtime Sync Active</div>
    </div>

    <div class="metrics-grid">
        <div class="metric-card">
            <div class="metric-title">Total Units Consigned & Sold</div>
            <div class="metric-value" id="totalUnits">0 Units</div>
        </div>
        <div class="metric-card">
            <div class="metric-title">Locked Wholesale Payout Owed</div>
            <div class="metric-value" id="totalPayout">R 0</div>
        </div>
        <div class="metric-card">
            <div class="metric-title">Active Pilot SKUs</div>
            <div class="metric-value">5 Lines</div>
        </div>
        <div class="metric-card">
            <div class="metric-title">Settlement Cycle</div>
            <div class="metric-value">15–30 Days</div>
        </div>
    </div>

    <div class="dashboard-layout">
        <div class="panel">
            <div class="panel-title">Weekly Unit Sales Velocity</div>
            <div class="chart-container">
                <canvas id="salesChart"></canvas>
            </div>
        </div>

        <div class="panel">
            <div class="panel-title">Consignment Sales Manifest</div>
            <ul class="manifest-list" id="manifestList">
                <li style="color: var(--text-muted); font-size: 12px;">Loading ledger orders...</li>
            </ul>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://aivsmcdhxfdccsbqmejt.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_NDE9uLsqMD2QiIa6LMw-Lw_IBOmeebV';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let salesChartInstance = null;

        function formatDate(dateString) {
            if (!dateString) return 'Date Pending';
            const date = new Date(dateString);
            return date.toLocaleDateString('en-GB', {
                day: '2-digit',
                month: 'short',
                year: 'numeric'
            });
        }

        async function fetchOrders() {
            const { data: orders, error } = await supabaseClient
                .from('orders')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                console.error('Error loading orders:', error);
                return;
            }

            renderDashboard(orders);
            renderChart(orders);
        }

        function renderDashboard(orders) {
            const manifestList = document.getElementById('manifestList');
            const totalUnitsEl = document.getElementById('totalUnits');
            const totalPayoutEl = document.getElementById('totalPayout');

            manifestList.innerHTML = '';

            let totalPayout = 0;
            let totalUnits = orders.length;

            orders.forEach(order => {
                totalPayout += parseFloat(order.wholesale_floor_zar || 0);

                const statusClass = order.payout_status === 'SETTLED' ? 'status-settled' : 'status-pending';
                const formattedDate = formatDate(order.created_at);

                const li = document.createElement('li');
                li.className = 'manifest-item';
                li.innerHTML = `
                    <div class="item-details">
                        <h4>${order.item_name}</h4>
                        <p>Order Ref: ${order.order_number} &bull; <span style="color: var(--gold-light);">${formattedDate}</span></p>
                    </div>
                    <div class="item-payout">
                        <div class="payout-amount">R ${parseFloat(order.wholesale_floor_zar).toFixed(0)}</div>
                        <span class="payout-status ${statusClass}">${order.payout_status}</span>
                    </div>
                `;
                manifestList.appendChild(li);
            });

            totalUnitsEl.innerText = `${totalUnits} Units`;
            totalPayoutEl.innerText = `R ${totalPayout.toLocaleString('en-ZA', { minimumFractionDigits: 0 })}`;
        }

        function renderChart(orders) {
            const ctx = document.getElementById('salesChart').getContext('2d');

            // Aggregate order units per date
            const dateCounts = {};
            
            // Sort ascending for chronological chart view
            const sortedOrders = [...orders].reverse();

            sortedOrders.forEach(order => {
                const dateKey = formatDate(order.created_at);
                dateCounts[dateKey] = (dateCounts[dateKey] || 0) + 1;
            });

            const labels = Object.keys(dateCounts).length > 0 ? Object.keys(dateCounts) : ['No Data'];
            const dataPoints = Object.values(dateCounts).length > 0 ? Object.values(dateCounts) : [0];

            if (salesChartInstance) {
                salesChartInstance.destroy();
            }

            salesChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Units Dispatched',
                        data: dataPoints,
                        borderColor: '#d4af37',
                        backgroundColor: 'rgba(212, 175, 55, 0.15)',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.3,
                        pointBackgroundColor: '#f3c649'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        x: {
                            grid: { color: '#1f2228' },
                            ticks: { color: '#a0a5ad', font: { size: 10 } }
                        },
                        y: {
                            grid: { color: '#1f2228' },
                            ticks: { color: '#a0a5ad', stepSize: 1, precision: 0 },
                            beginAtZero: true
                        }
                    }
                }
            });
        }

        // Initialize and listen for real-time order updates
        fetchOrders();
        supabaseClient
            .channel('orders_realtime')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'orders' }, () => {
                fetchOrders();
            })
            .subscribe();
    </script>
</body>
</html>
