<script>
    const SUPABASE_URL = 'https://aivsmcdhxfdccsbqmejt.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_NDE9uLsqMD2QiIa6LMw-Lw_IBOmeebV';
    
    let supabaseClient;
    try {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    } catch (e) {
        console.error("Supabase load error", e);
    }

    let allOrders = [];
    let allInventory = [];

    window.addEventListener('DOMContentLoaded', () => {
        fetchSupplierData();

        if (supabaseClient) {
            supabaseClient.channel('supplier_realtime').on('postgres_changes', { event: '*', schema: 'public' }, () => {
                fetchSupplierData();
            }).subscribe();
        }
    });

    async function fetchSupplierData() {
        if (!supabaseClient) return;

        // Select ONLY wholesale columns to prevent any retail/selling_price leak
        const { data: orders } = await supabaseClient
            .from('orders')
            .select('id, item_name, quantity_dispatched, wholesale_floor_zar, payout_status, supplier, created_at, order_number')
            .order('created_at', { ascending: false });

        const { data: inventory } = await supabaseClient
            .from('inventory')
            .select('id, item_name, wholesale_floor_zar, supplier, created_at')
            .order('created_at', { ascending: false });

        allOrders = orders || [];
        allInventory = inventory || [];

        populateSupplierDropdown(allOrders);
        renderSupplierPortal('ALL');
    }

    function populateSupplierDropdown(orders) {
        const select = document.getElementById('supplierSelect');
        const suppliers = [...new Set(orders.map(o => o.supplier).filter(Boolean))];
        
        select.innerHTML = '<option value="ALL" style="background:#14161c;">-- All Suppliers / Master View --</option>';
        
        suppliers.forEach(supp => {
            const opt = document.createElement('option');
            opt.value = supp;
            opt.style.background = '#14161c';
            opt.innerText = supp;
            select.appendChild(opt);
        });
    }

    function filterSupplierLedger() {
        const selectedSupplier = document.getElementById('supplierSelect').value;
        document.getElementById('activeSupplierName').innerText = selectedSupplier === 'ALL' ? 'All Consignment Partners' : selectedSupplier;
        renderSupplierPortal(selectedSupplier);
    }

    function renderSupplierPortal(supplierFilter) {
        const filteredOrders = supplierFilter === 'ALL' 
            ? allOrders 
            : allOrders.filter(o => o.supplier === supplierFilter);

        const filteredInventory = supplierFilter === 'ALL'
            ? allInventory
            : allInventory.filter(i => i.supplier === supplierFilter);

        // Calculate Metrics STRICTLY using wholesale_floor_zar
        let totalUnits = 0;
        let totalOwed = 0;

        filteredOrders.forEach(order => {
            if (order.payout_status !== 'RETURNED / CANCELLED') {
                totalUnits += (parseInt(order.quantity_dispatched) || 1);
                if (order.payout_status === 'ESCROW PENDING' || !order.payout_status) {
                    // Strictly use wholesale floor price
                    totalOwed += (parseFloat(order.wholesale_floor_zar) || 0);
                }
            }
        });

        document.getElementById('metricUnits').innerText = `${totalUnits} Units`;
        document.getElementById('metricOwed').innerText = `R ${totalOwed.toFixed(2)}`;
        document.getElementById('metricSkus').innerText = `${filteredInventory.length} Lines`;

        // Render Manifest List
        const manifestList = document.getElementById('manifestList');
        manifestList.innerHTML = '';

        if (filteredOrders.length === 0) {
            manifestList.innerHTML = '<div style="color: var(--text-muted); text-align: center; padding: 40px;">No transaction records found for this partner.</div>';
            return;
        }

        filteredOrders.forEach(order => {
            // Strictly pull wholesale floor price
            const wholesaleAmount = parseFloat(order.wholesale_floor_zar) || 0;
            const status = order.payout_status || 'ESCROW PENDING';
            const badgeClass = status === 'SETTLED' ? 'status-settled' : 'status-pending';
            const dateStr = order.created_at ? new Date(order.created_at).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }) : 'Recent';

            const div = document.createElement('div');
            div.className = 'manifest-item';
            div.innerHTML = `
                <div>
                    <div class="manifest-item-name">${order.item_name || 'Consigned Item'}</div>
                    <div class="manifest-item-meta">Order Ref: #${order.order_number || order.id.slice(0, 8)} • ${dateStr}</div>
                </div>
                <div class="manifest-item-price">
                    <div class="manifest-amount">R ${wholesaleAmount.toFixed(2)}</div>
                    <span class="status-badge ${badgeClass}">${status}</span>
                </div>
            `;
            manifestList.appendChild(div);
        });
    }
</script>
