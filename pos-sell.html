<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nguni Homeware | Cashier POS Selling Front</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-dark: #0f0f0f;
            --card-bg: #161616;
            --border-color: #262626;
            --accent-gold: #f3c65d;
            --accent-hover: #d4ab47;
            --text-main: #ffffff;
            --text-muted: #888888;
            --success: #22c55e;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 1.25rem;
            letter-spacing: 1px;
            color: var(--accent-gold);
        }

        .header-actions {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .nav-link {
            color: var(--accent-gold);
            text-decoration: none;
            font-size: 0.85rem;
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 6px;
            background: var(--card-bg);
            transition: background 0.2s;
        }

        .nav-link:hover {
            background: var(--border-color);
        }

        .cashier-badge {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.85rem;
            color: var(--accent-gold);
        }

        .pos-container {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .card-title {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--accent-gold);
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 5px;
            letter-spacing: 0.5px;
        }

        input, select {
            width: 100%;
            background: var(--bg-dark);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 12px;
            border-radius: 6px;
            font-size: 1rem;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--accent-gold);
        }

        .inline-fields {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .btn-gold {
            background-color: var(--accent-gold);
            color: #000;
            font-weight: 600;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
            transition: background 0.2s;
        }

        .btn-gold:hover {
            background-color: var(--accent-hover);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.9rem;
        }

        th {
            color: var(--text-muted);
            font-size: 0.75rem;
            text-transform: uppercase;
        }

        .total-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid var(--border-color);
            font-size: 1.25rem;
            font-weight: bold;
        }

        .total-amount {
            color: var(--accent-gold);
        }

        .remove-btn {
            background: transparent;
            border: none;
            color: var(--danger);
            cursor: pointer;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>NGUNI HOMEWARE | RETAIL FRONT DESK</h1>
        <div class="header-actions">
            <a href="admin.html" class="nav-link">&larr; Back to Admin Hub</a>
            <div class="cashier-badge">CASHIER: COUNTER-01</div>
        </div>
    </header>

    <div class="pos-container">
        <!-- Left Column: Barcode Scan & Staging Input -->
        <div>
            <div class="card">
                <div class="card-title">Live Barcode Scan & Terminal Checkout</div>
                
                <div class="form-group">
                    <label for="barcodeScan">Scan Barcode / Type SKU</label>
                    <input type="text" id="barcodeScan" placeholder="Scan barcode or type item number..." autofocus>
                </div>

                <div class="inline-fields">
                    <div class="form-group">
                        <label for="itemDesc">Product Name</label>
                        <input type="text" id="itemDesc" readonly placeholder="Waiting for barcode scan...">
                    </div>
                    <div class="form-group">
                        <label for="barcodeDisplay">Barcode / SKU</label>
                        <input type="text" id="barcodeDisplay" readonly value="--">
                    </div>
                </div>

                <div class="inline-fields">
                    <div class="form-group">
                        <label for="stockAvail">Stock Available</label>
                        <input type="number" id="stockAvail" readonly value="0">
                    </div>
                    <div class="form-group">
                        <label for="unitPrice">Unit Price (ZAR)</label>
                        <input type="number" id="unitPrice" readonly value="0.00">
                    </div>
                </div>

                <div class="inline-fields">
                    <div class="form-group">
                        <label for="orderRef">Order Reference / Transaction No.</label>
                        <input type="text" id="orderRef" placeholder="e.g. #1043 or POS-8923">
                    </div>
                    <div class="form-group">
                        <label for="quantity">Quantity</label>
                        <input type="number" id="quantity" value="1" min="1">
                    </div>
                </div>

                <div class="form-group">
                    <label for="supplierTag">Consignor / Supplier</label>
                    <input type="text" id="supplierTag" readonly value="--">
                </div>

                <button class="btn-gold" id="stageItemBtn">+ Stage Item to Batch</button>
            </div>
        </div>

        <!-- Right Column: Transaction Staged Batch & Grand Total -->
        <div>
            <div class="card">
                <div class="card-title">Staged Transaction Batch</div>
                
                <div style="max-height: 350px; overflow-y: auto;">
                    <table>
                        <thead>
                            <tr>
                                <th>Product</th>
                                <th>Qty</th>
                                <th>Subtotal</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="cartTableBody">
                            <tr>
                                <td colspan="4" style="text-align: center; color: var(--text-muted);">No items added to current transaction batch.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="total-section">
                    <span>Grand Total:</span>
                    <span class="total-amount" id="grandTotalDisplay">R 0.00</span>
                </div>

                <div style="margin-top: 20px;">
                    <button class="btn-gold" id="checkoutBtn">Dispatch & Print Receipt</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // REPLACE WITH YOUR ACTUAL SUPABASE CREDENTIALS FROM ADMIN.HTML
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const barcodeInput = document.getElementById('barcodeScan');
        const itemDescInput = document.getElementById('itemDesc');
        const barcodeDisplay = document.getElementById('barcodeDisplay');
        const stockAvailInput = document.getElementById('stockAvail');
        const unitPriceInput = document.getElementById('unitPrice');
        const supplierTagInput = document.getElementById('supplierTag');
        const orderRefInput = document.getElementById('orderRef');
        const quantityInput = document.getElementById('quantity');
        
        const stageItemBtn = document.getElementById('stageItemBtn');
        const cartTableBody = document.getElementById('cartTableBody');
        const grandTotalDisplay = document.getElementById('grandTotalDisplay');
        const checkoutBtn = document.getElementById('checkoutBtn');

        let currentInventory = [];
        let stagedBatch = [];
        let activeScannedItem = null;

        async function fetchLiveInventory() {
            const { data, error } = await supabaseClient.from('inventory').select('*');
            if (error) {
                console.error('Error fetching inventory:', error);
            } else {
                currentInventory = data || [];
            }
        }
        fetchLiveInventory();

        barcodeInput.addEventListener('input', (e) => {
            const query = e.target.value.trim().toLowerCase();
            activeScannedItem = currentInventory.find(item => 
                item.sku?.toLowerCase() === query || item.item_number?.toLowerCase() === query
            );

            if (activeScannedItem) {
                itemDescInput.value = activeScannedItem.item_description || activeScannedItem.product_name || '';
                barcodeDisplay.value = activeScannedItem.sku || activeScannedItem.item_number || '';
                stockAvailInput.value = activeScannedItem.stock_qty || 0;
                unitPriceInput.value = activeScannedItem.wholesale_floor || activeScannedItem.unit_price || 0;
                supplierTagInput.value = activeScannedItem.supplier_partner || activeScannedItem.consignor || '';
            } else {
                itemDescInput.value = "Item not found in live stock";
                barcodeDisplay.value = "--";
                stockAvailInput.value = 0;
                unitPriceInput.value = 0.00;
                supplierTagInput.value = "--";
            }
        });

        stageItemBtn.addEventListener('click', () => {
            if (!activeScannedItem) {
                alert("Please scan or select a valid inventory item first.");
                return;
            }

            const qty = parseInt(quantityInput.value) || 1;
            const stockAvailable = parseInt(stockAvailInput.value) || 0;

            if (qty > stockAvailable) {
                alert("Cannot stage more than available stock quantity on hand.");
                return;
            }

            const price = parseFloat(unitPriceInput.value) || 0;
            const subtotal = qty * price;

            stagedBatch.push({
                id: activeScannedItem.id,
                sku: barcodeDisplay.value,
                desc: itemDescInput.value,
                supplier: supplierTagInput.value,
                qty: qty,
                price: price,
                subtotal: subtotal
            });

            renderBatchCart();
            resetScanFields();
        });

        function renderBatchCart() {
            if (stagedBatch.length === 0) {
                cartTableBody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: var(--text-muted);">No items added to current transaction batch.</td></tr>`;
                grandTotalDisplay.innerText = "R 0.00";
                return;
            }

            let html = '';
            let grandTotal = 0;

            stagedBatch.forEach((item, index) => {
                grandTotal += item.subtotal;
                html += `
                    <tr>
                        <td>${item.desc}<br><small style="color:var(--text-muted);">${item.sku}</small></td>
                        <td>${item.qty}</td>
                        <td>R ${item.subtotal.toFixed(2)}</td>
                        <td><button class="remove-btn" onclick="removeStagedItem(${index})">Remove</button></td>
                    </tr>
                `;
            });

            cartTableBody.innerHTML = html;
            grandTotalDisplay.innerText = `R ${grandTotal.toFixed(2)}`;
        }

        window.removeStagedItem = function(index) {
            stagedBatch.splice(index, 1);
            renderBatchCart();
        }

        function resetScanFields() {
            barcodeInput.value = '';
            itemDescInput.value = '';
            barcodeDisplay.value = '--';
            stockAvailInput.value = '0';
            unitPriceInput.value = '0.00';
            supplierTagInput.value = '--';
            quantityInput.value = '1';
            activeScannedItem = null;
            barcodeInput.focus();
        }

        checkoutBtn.addEventListener('click', async () => {
            if (stagedBatch.length === 0) {
                alert("Batch is empty. Add items before completing checkout.");
                return;
            }

            const orderRef = orderRefInput.value.trim() || `POS-${Math.floor(1000 + Math.random() * 9000)}`;

            for (const item of stagedBatch) {
                const { error: orderError } = await supabaseClient.from('orders').insert([{
                    order_ref: orderRef,
                    sku: item.sku,
                    item_description: item.desc,
                    supplier_partner: item.supplier,
                    quantity: item.qty,
                    subtotal: item.subtotal,
                    status: 'SETTLED'
                }]);

                if (orderError) {
                    console.error("Failed to sync order:", orderError);
                }
            }

            alert(`Transaction ${orderRef} successfully processed and synced! Printing receipt...`);
            stagedBatch = [];
            orderRefInput.value = '';
            renderBatchCart();
            fetchLiveInventory();
        });
    </script>
</body>
</html>
