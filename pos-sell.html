<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nguni Homeware | Cashier POS Front Desk</title>
    <link rel="icon" type="image/png" href="logo.png">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-dark: #08080a;
            --card-bg: rgba(28, 28, 32, 0.65);
            --border-color: rgba(255, 255, 255, 0.1);
            --accent-gold: #f3c65d;
            --accent-hover: #fae19c;
            --text-main: #f5f5f7;
            --text-muted: #86868b;
            --success: #30d158;
            --danger: #ff453a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            padding: 30px;
            background-image: 
                radial-gradient(circle at 20% 10%, rgba(243, 198, 93, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 80% 90%, rgba(48, 209, 88, 0.03) 0%, transparent 40%);
            min-height: 100vh;
        }

        #loginOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(8, 8, 10, 0.85);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .login-box {
            background: rgba(36, 36, 40, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 50px 40px;
            border-radius: 24px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
        }

        .login-logo {
            width: 72px;
            height: 72px;
            object-fit: contain;
            margin-bottom: 24px;
            filter: drop-shadow(0 4px 12px rgba(243, 198, 93, 0.2));
        }

        .login-title {
            font-size: 1.1rem;
            color: var(--text-main);
            font-weight: 600;
            margin-bottom: 8px;
        }

        .login-subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 30px;
        }

        .pin-input {
            text-align: center;
            letter-spacing: 12px;
            font-size: 1.8rem;
            font-weight: 500;
            padding: 16px;
            border-radius: 14px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--accent-gold);
            transition: all 0.3s ease;
        }

        .pin-input:focus {
            outline: none;
            border-color: var(--accent-gold);
            box-shadow: 0 0 0 4px rgba(243, 198, 93, 0.15);
            background: rgba(0, 0, 0, 0.7);
        }

        #appContainer {
            display: none;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 22px;
            margin-bottom: 30px;
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .brand-logo {
            width: 44px;
            height: 44px;
            object-fit: contain;
        }

        h1 {
            font-size: 1rem;
            letter-spacing: 0.05em;
            color: var(--text-main);
            font-weight: 600;
        }

        .header-actions {
            display: flex;
            gap: 14px;
            align-items: center;
        }

        .nav-link {
            color: var(--text-main);
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 500;
            border: 1px solid var(--border-color);
            padding: 10px 16px;
            border-radius: 10px;
            background: var(--card-bg);
            transition: all 0.2s ease;
        }

        .nav-link:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .cashier-badge {
            background: rgba(243, 198, 93, 0.1);
            border: 1px solid rgba(243, 198, 93, 0.2);
            padding: 10px 18px;
            border-radius: 10px;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--accent-gold);
        }

        .pos-container {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 24px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 28px;
            margin-bottom: 20px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4);
        }

        .card-title {
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            margin-bottom: 22px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.72rem;
            font-weight: 500;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 8px;
            letter-spacing: 0.05em;
        }

        input, select {
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 13px 16px;
            border-radius: 12px;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--accent-gold);
            background: rgba(0, 0, 0, 0.6);
            box-shadow: 0 0 0 3px rgba(243, 198, 93, 0.12);
        }

        input[readonly] {
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.02);
            border-color: rgba(255, 255, 255, 0.04);
        }

        .inline-fields {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .btn-gold {
            background-color: var(--accent-gold);
            color: #111;
            font-weight: 600;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 12px;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 0.08em;
            transition: all 0.2s ease;
            box-shadow: 0 4px 20px rgba(243, 198, 93, 0.25);
        }

        .btn-gold:hover {
            background-color: var(--accent-hover);
            transform: translateY(-1px);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 5px;
        }

        th, td {
            text-align: left;
            padding: 14px 10px;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.85rem;
        }

        th {
            color: var(--text-muted);
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .total-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid var(--border-color);
            font-size: 1.2rem;
            font-weight: 600;
        }

        .total-amount {
            color: var(--accent-gold);
        }

        .tender-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 15px;
        }

        .tender-btn {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.8rem;
            text-transform: uppercase;
            transition: all 0.2s;
        }

        .tender-btn.active {
            border-color: var(--accent-gold);
            background: rgba(243, 198, 93, 0.1);
            color: var(--accent-gold);
        }

        .remove-btn {
            background: transparent;
            border: none;
            color: var(--danger);
            cursor: pointer;
            font-size: 0.8rem;
            opacity: 0.8;
        }

        .remove-btn:hover {
            opacity: 1;
        }

        .error-msg {
            color: var(--danger);
            font-size: 0.8rem;
            font-weight: 500;
            margin-top: 14px;
            display: none;
        }
    </style>
</head>
<body>

    <div id="loginOverlay">
        <div class="login-box">
            <img src="logo.png" alt="Nguni Logo" class="login-logo">
            <div class="login-title">Authentication Required</div>
            <div class="login-subtitle">Enter 4-digit cashier security PIN</div>
            
            <div class="form-group" style="margin-bottom: 0;">
                <input type="password" id="cashierPinInput" class="pin-input" placeholder="••••" autofocus maxlength="6">
            </div>
            
            <div id="loginError" class="error-msg">Incorrect PIN. Please try again.</div>
        </div>
    </div>

    <div id="appContainer">
        <header>
            <div class="brand-container">
                <img src="logo.png" alt="Nguni Logo" class="brand-logo">
                <h1>NGUNI HOMEWARE | RETAIL FRONT DESK</h1>
            </div>
            <div class="header-actions">
                <a href="admin.html" class="nav-link">&larr; Admin Hub</a>
                <div class="cashier-badge" id="cashierBadgeDisplay">CASHIER: COUNTER-01</div>
            </div>
        </header>

        <div class="pos-container">
            <div>
                <div class="card">
                    <div class="card-title">Live Barcode Scan & Terminal Checkout</div>
                    
                    <div class="form-group">
                        <label for="barcodeScan">Scan Barcode / Type SKU</label>
                        <input type="text" id="barcodeScan" placeholder="Scan barcode or type item number..." autofocus>
                    </div>

                    <div class="inline-fields">
                        <div class="form-group">
                            <label for="itemDesc">Product Name</label>
                            <input type="text" id="itemDesc" readonly placeholder="Waiting for barcode scan...">
                        </div>
                        <div class="form-group">
                            <label for="barcodeDisplay">Barcode / SKU</label>
                            <input type="text" id="barcodeDisplay" readonly value="--">
                        </div>
                    </div>

                    <div class="inline-fields">
                        <div class="form-group">
                            <label for="stockAvail">Stock Available</label>
                            <input type="number" id="stockAvail" readonly value="0">
                        </div>
                        <div class="form-group">
                            <label for="unitPrice">Unit Price (ZAR)</label>
                            <input type="number" id="unitPrice" readonly value="0.00">
                        </div>
                    </div>

                    <div class="inline-fields">
                        <div class="form-group">
                            <label for="orderRef">Order Reference / Transaction No.</label>
                            <input type="text" id="orderRef" placeholder="e.g. #1043 or POS-8923">
                        </div>
                        <div class="form-group">
                            <label for="quantity">Quantity</label>
                            <input type="number" id="quantity" value="1" min="1">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="supplierTag">Consignor / Supplier</label>
                        <input type="text" id="supplierTag" readonly value="--">
                    </div>

                    <button class="btn-gold" id="stageItemBtn">+ Stage Item to Batch</button>
                </div>
            </div>

            <div>
                <div class="card">
                    <div class="card-title">Staged Transaction Batch</div>
                    
                    <div style="max-height: 240px; overflow-y: auto;">
                        <table>
                            <thead>
                                <tr>
                                    <th>Product</th>
                                    <th>Qty</th>
                                    <th>Subtotal</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody id="cartTableBody">
                                <tr>
                                    <td colspan="4" style="text-align: center; color: var(--text-muted); padding: 20px 0;">No items added yet.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="total-section">
                        <span>Grand Total:</span>
                        <span class="total-amount" id="grandTotalDisplay">R 0.00</span>
                    </div>

                    <div style="margin-top: 20px;">
                        <label>Payment Tender Method</label>
                        <div class="tender-options">
                            <button class="tender-btn active" id="tenderCash" onclick="setTender('CASH')">Cash</button>
                            <button class="tender-btn" id="tenderCard" onclick="setTender('CARD')">Card / POS</button>
                        </div>

                        <div class="form-group" id="cashTenderGroup">
                            <label for="cashReceived">Cash Tendered (ZAR)</label>
                            <input type="number" id="cashReceived" placeholder="0.00" oninput="calculateChange()">
                        </div>

                        <div class="form-group" id="changeDueGroup">
                            <label for="changeDue">Change Due</label>
                            <input type="text" id="changeDue" readonly value="R 0.00" style="color: var(--success); font-weight: 650;">
                        </div>

                        <button class="btn-gold" id="checkoutBtn" style="margin-top: 5px;">Complete & Sync Sale</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://aivsmcdhxfdccsbqmejt.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_NDE9uLsqMD2QiIa6LMw-Lw_IBOmeebV';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const loginOverlay = document.getElementById('loginOverlay');
        const appContainer = document.getElementById('appContainer');
        const cashierPinInput = document.getElementById('cashierPinInput');
        const loginError = document.getElementById('loginError');
        const cashierBadgeDisplay = document.getElementById('cashierBadgeDisplay');

        let activeCashierName = 'COUNTER-01';
        let selectedTender = 'CASH';

        cashierPinInput.addEventListener('input', async (e) => {
            const enteredPin = e.target.value.trim();
            loginError.style.display = 'none';

            if (enteredPin.length >= 4) {
                const { data, error } = await supabaseClient
                    .from('cashiers')
                    .select('*')
                    .eq('pin', enteredPin)
                    .single();

                if (!error && data) {
                    activeCashierName = data.cashier_name.toUpperCase();
                    loginOverlay.style.opacity = '0';
                    loginOverlay.style.transition = 'opacity 0.3s ease';
                    setTimeout(() => {
                        loginOverlay.style.display = 'none';
                        appContainer.style.display = 'block';
                        cashierBadgeDisplay.innerText = `CASHIER: ${activeCashierName}`;
                        fetchLiveInventory();
                        document.getElementById('barcodeScan').focus();
                    }, 300);
                } else if (enteredPin.length >= 6) {
                    loginError.style.display = 'block';
                    cashierPinInput.value = '';
                }
            }
        });

        window.setTender = function(method) {
            selectedTender = method;
            document.getElementById('tenderCash').classList.toggle('active', method === 'CASH');
            document.getElementById('tenderCard').classList.toggle('active', method === 'CARD');
            
            const cashGroup = document.getElementById('cashTenderGroup');
            const changeGroup = document.getElementById('changeDueGroup');
            if (method === 'CARD') {
                cashGroup.style.display = 'none';
                changeGroup.style.display = 'none';
            } else {
                cashGroup.style.display = 'block';
                changeGroup.style.display = 'block';
            }
        }

        const barcodeInput = document.getElementById('barcodeScan');
        const itemDescInput = document.getElementById('itemDesc');
        const barcodeDisplay = document.getElementById('barcodeDisplay');
        const stockAvailInput = document.getElementById('stockAvail');
        const unitPriceInput = document.getElementById('unitPrice');
        const supplierTagInput = document.getElementById('supplierTag');
        const orderRefInput = document.getElementById('orderRef');
        const quantityInput = document.getElementById('quantity');
        
        const stageItemBtn = document.getElementById('stageItemBtn');
        const cartTableBody = document.getElementById('cartTableBody');
        const grandTotalDisplay = document.getElementById('grandTotalDisplay');
        const checkoutBtn = document.getElementById('checkoutBtn');

        let currentInventory = [];
        let stagedBatch = [];
        let activeScannedItem = null;
        let currentGrandTotal = 0;

        async function fetchLiveInventory() {
            const { data, error } = await supabaseClient.from('inventory').select('*');
            if (!error) {
                currentInventory = data || [];
            } else {
                console.error("Error loading inventory:", error);
            }
        }

        // Auto-detect barcode lookup and immediate auto-stage on Enter key
        barcodeInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                processScannedItem();
            }
        });

        barcodeInput.addEventListener('input', (e) => {
            const query = e.target.value.trim().toLowerCase();
            if (!query) return;

            activeScannedItem = currentInventory.find(item => {
                const s = String(item.sku || '').toLowerCase();
                const num = String(item.item_number || '').toLowerCase();
                const barcode = String(item.barcode || '').toLowerCase();
                return s === query || num === query || barcode === query;
            });

            if (activeScannedItem) {
                updateScanUI(activeScannedItem, query);
            } else {
                itemDescInput.value = "Item not found in live stock";
                barcodeDisplay.value = query;
                stockAvailInput.value = 0;
                unitPriceInput.value = "0.00";
                supplierTagInput.value = "--";
            }
        });

        function updateScanUI(item, query) {
            const name = item.item_description || item.product_name || item.name || 'Unnamed Product';
            const code = item.sku || item.item_number || item.barcode || query;
            const stock = item.stock_qty ?? item.stock ?? item.quantity ?? 0;
            const price = item.wholesale_floor || item.unit_price || item.price || 0;
            const supplier = item.supplier_partner || item.consignor || item.supplier || 'Standard';

            itemDescInput.value = name;
            barcodeDisplay.value = code;
            stockAvailInput.value = stock;
            unitPriceInput.value = parseFloat(price).toFixed(2);
            supplierTagInput.value = supplier;
        }

        function processScannedItem() {
            const query = barcodeInput.value.trim().toLowerCase();
            if (!activeScannedItem && query) {
                activeScannedItem = currentInventory.find(item => {
                    const s = String(item.sku || '').toLowerCase();
                    const num = String(item.item_number || '').toLowerCase();
                    const barcode = String(item.barcode || '').toLowerCase();
                    return s === query || num === query || barcode === query;
                });
            }

            if (!activeScannedItem) {
                alert("Please scan or enter a valid inventory item.");
                return;
            }

            const qty = parseInt(quantityInput.value) || 1;
            const stockAvailable = parseInt(stockAvailInput.value) || 0;

            if (qty > stockAvailable && stockAvailable > 0) {
                alert("Cannot stage more than available stock quantity on hand.");
                return;
            }

            const price = parseFloat(unitPriceInput.value) || 0;
            const subtotal = qty * price;

            stagedBatch.push({
                id: activeScannedItem.id,
                sku: barcodeDisplay.value,
                desc: itemDescInput.value,
                supplier: supplierTagInput.value,
                qty: qty,
                price: price,
                subtotal: subtotal
            });

            renderBatchCart();
            resetScanFields();
        }

        stageItemBtn.addEventListener('click', processScannedItem);

        function renderBatchCart() {
            if (stagedBatch.length === 0) {
                cartTableBody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: var(--text-muted); padding: 20px 0;">No items added yet.</td></tr>`;
                currentGrandTotal = 0;
                grandTotalDisplay.innerText = "R 0.00";
                return;
            }

            let html = '';
            currentGrandTotal = 0;

            stagedBatch.forEach((item, index) => {
                currentGrandTotal += item.subtotal;
                html += `
                    <tr>
                        <td>${item.desc}<br><small style="color:var(--text-muted);">${item.sku}</small></td>
                        <td>${item.qty}</td>
                        <td>R ${item.subtotal.toFixed(2)}</td>
                        <td><button class="remove-btn" onclick="removeStagedItem(${index})">Remove</button></td>
                    </tr>
                `;
            });

            cartTableBody.innerHTML = html;
            grandTotalDisplay.innerText = `R ${currentGrandTotal.toFixed(2)}`;
            calculateChange();
        }

        window.removeStagedItem = function(index) {
            stagedBatch.splice(index, 1);
            renderBatchCart();
        }

        window.calculateChange = function() {
            if (selectedTender === 'CARD') return;
            const cashReceived = parseFloat(document.getElementById('cashReceived').value) || 0;
            const change = cashReceived - currentGrandTotal;
            document.getElementById('changeDue').value = change >= 0 ? `R ${change.toFixed(2)}` : "Insufficient Cash";
        }

        function resetScanFields() {
            barcodeInput.value = '';
            itemDescInput.value = '';
            barcodeDisplay.value = '--';
            stockAvailInput.value = '0';
            unitPriceInput.value = '0.00';
            supplierTagInput.value = '--';
            quantityInput.value = '1';
            activeScannedItem = null;
            barcodeInput.focus();
        }

        checkoutBtn.addEventListener('click', async () => {
            if (stagedBatch.length === 0) {
                alert("Batch is empty. Add items before completing checkout.");
                return;
            }

            if (selectedTender === 'CASH') {
                const cashReceived = parseFloat(document.getElementById('cashReceived').value) || 0;
                if (cashReceived < currentGrandTotal) {
                    alert("Tendered cash is less than the grand total.");
                    return;
                }
            }

            const orderRef = orderRefInput.value.trim() || `POS-${Math.floor(1000 + Math.random() * 9000)}`;

            for (const item of stagedBatch) {
                const { error: orderError } = await supabaseClient.from('orders').insert([{
                    order_ref: orderRef,
                    sku: item.sku,
                    item_description: item.desc,
                    supplier_partner: item.supplier,
                    quantity: item.qty,
                    subtotal: item.subtotal,
                    payment_method: selectedTender,
                    cashier: activeCashierName,
                    status: 'SETTLED'
                }]);

                if (orderError) console.error("Order sync error:", orderError);

                const matchedStockItem = currentInventory.find(inv => 
                    String(inv.sku || '').toLowerCase() === String(item.sku).toLowerCase() || 
                    String(inv.item_number || '').toLowerCase() === String(item.sku).toLowerCase()
                );
                
                if (matchedStockItem) {
                    const currentStockVal = matchedStockItem.stock_qty ?? matchedStockItem.stock ?? matchedStockItem.quantity ?? 0;
                    const newQty = Math.max(0, currentStockVal - item.qty);
                    
                    const updatePayload = {};
                    if ('stock_qty' in matchedStockItem) updatePayload.stock_qty = newQty;
                    else if ('stock' in matchedStockItem) updatePayload.stock = newQty;
                    else if ('quantity' in matchedStockItem) updatePayload.quantity = newQty;

                    await supabaseClient.from('inventory').update(updatePayload).eq('id', matchedStockItem.id);
                }
            }

            alert(`Sale ${orderRef} successfully settled via ${selectedTender} (${activeCashierName})! Receipt dispatched.`);
            
            stagedBatch = [];
            orderRefInput.value = '';
            document.getElementById('cashReceived').value = '';
            document.getElementById('changeDue').value = 'R 0.00';
            renderBatchCart();
            fetchLiveInventory();
            barcodeInput.focus();
        });
    </script>
</body>
</html>
